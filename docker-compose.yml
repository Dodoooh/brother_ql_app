services:
  brother_ql_app:
    image: dodoooh/brother_ql_app:dev
    container_name: brother_ql_app
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      # Uploads are ephemeral scratch storage (render -> print -> delete, plus a
      # TTL sweep for shared files) and intentionally not persisted. To keep them,
      # set the UPLOAD_FOLDER env var below and mount a volume onto that path, e.g.
      #   environment:
      #     - UPLOAD_FOLDER=/app/uploads
      #   volumes:
      #     - ./uploads:/app/uploads
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app
      - FLASK_ENV=production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
