services:
  brother_ql_app:
    image: dodoooh/brother_ql_app:latest
    container_name: brother_ql_app
    ports:
      - "5055:5000"
    volumes:
      - ./data:/app/data
      - ./src/config:/app/src/config
      - ./uploads:/app/uploads
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app
      - FLASK_ENV=production
