openapi: 3.0.3
info:
  title: Brother QL Printer API
  description: |
    API for controlling Brother QL label printers, enabling customizable text and image printing.
    This API allows for printing formatted text and images on labels with various settings.
  version: 4.0.0-dev
  contact:
    name: Brother QL Printer App Support
    url: https://github.com/dodoooh/brother_ql_app/issues

servers:
  - url: /api/v1
    description: Default API server

tags:
  - name: printer
    description: Printer operations
  - name: text
    description: Text printing operations
  - name: image
    description: Image printing operations
  - name: pdf
    description: PDF printing operations
  - name: share
    description: Generic file sharing from external apps
  - name: qrcode
    description: QR code operations
  - name: label
    description: Combined label layouts
  - name: preview
    description: Server-side render-only label previews (no printing)
  - name: calibration
    description: Print alignment calibration (target printing and preview)
  - name: settings
    description: Settings management
  - name: jobs
    description: Print queue job status and management

# Advertise the optional API-key scheme so the Swagger UI shows an "Authorize"
# button and injects the X-API-Key header into "Try it out" calls. Actual
# enforcement is the Flask before_request hook (opt-in via the API_KEY env var);
# when API_KEY is unset the hook allows everything, so this declaration does not
# gate the API by itself. The hook also keeps the docs page, the OpenAPI spec
# and the health endpoints reachable without a key.
security:
  - ApiKeyAuth: []

paths:
  /printers:
    get:
      summary: Get available printers
      description: Returns a list of configured printers
      operationId: api.printer_controller.get_printers
      tags:
        - printer
      responses:
        '200':
          description: List of printers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Printer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /printers/status:
    post:
      summary: Check printer status
      description: >-
        Checks whether a printer answers, whether anything is stopping it from
        printing, and which media it is loaded with. Reachability and readiness
        are reported separately: a printer with its cover open or no roll in it
        answers perfectly well (reachable=true) but cannot print
        (available=false, state=blocked).
      operationId: api.printer_controller.check_printer_status
      tags:
        - printer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrinterStatusRequest'
      responses:
        '200':
          description: Printer status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
          
  /printers/keep-alive:
    get:
      summary: Get keep alive status
      description: Gets the current status of the keep alive feature
      operationId: api.printer_controller.get_keep_alive_status
      tags:
        - printer
      responses:
        '200':
          description: Keep alive status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeepAliveStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    put:
      summary: Update keep alive settings
      description: Updates the keep alive settings and starts/stops the keep alive thread
      operationId: api.printer_controller.update_keep_alive
      tags:
        - printer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeepAliveRequest'
      responses:
        '200':
          description: Keep alive updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeepAliveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /printers/relay-power:
    get:
      summary: Get relay power-control status
      description: >-
        Reports the state of relay power control: whether it is switched on, the
        timing chain it derives from the settings, when the "turn_off" webhook is
        next due, and the outcome of the most recent webhook.


        The chain is reported as clock times as well as offsets. Each of its four
        moments — the origin, the heartbeat stopping, the printer powering itself
        off, the turn_off webhook — comes as a unix timestamp, as ISO-8601, and
        as the seconds remaining until it, so a countdown can be anchored per
        moment and ticked locally without drifting. `next_step` names the one the
        chain is waiting on.


        Two things about the times before rendering them. `origin_source` says
        what the origin really is — a print, the process start time the app
        falls back to before anything has printed, or the current time once a
        window has run out and the chain is being shown from now — and calling
        any of the last two "last print" would name a print that never happened.
        `last_print_at` is the field for that, and it is null when there was no
        last print. And null is an answer elsewhere too: no timed keep-alive
        window, keep-alive switched off, or a turn_off nothing has armed all
        mean there is no moment to show.


        Read-only and side-effect free — it never sends a webhook and never
        contacts the printer.


        While relay power control is enabled together with its turn_off half, the
        response carries a `warning` field naming the one thing the app cannot
        check on the user's behalf: that printer_auto_power_off_minutes matches
        what the device is really set to. Show it wherever the setting is made.
      operationId: api.printer_controller.get_relay_power_status
      tags:
        - printer
      responses:
        '200':
          description: Relay power-control status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayPowerStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /printers/relay-power/send:
    post:
      summary: Send a relay power webhook now
      description: >-
        Sends one "turn_on" or "turn_off" webhook immediately and reports what
        happened, so a relay can be proved to answer without waiting for a print
        job or for the timed window to run out.


        ⚠️ **This really switches the relay.** Sending "turn_off" cuts mains
        power to the printer, which is why this is a POST with the action named
        in the body rather than anything reachable by following a link. It is
        the one place a user can cut power deliberately, and the response says
        in as many words that it did.


        Requires relay_webhook_enabled and a URL for the action. It deliberately
        does **not** require the schedule to be armed: "turn_off" can be sent by
        hand while relay_webhook_turn_off_enabled is off and while no timed
        keep-alive window exists, because whether the relay switches off is worth
        establishing before arming anything that will cut power unattended.


        The schedule is not touched in either direction. A hand-sent "turn_off"
        does not clear a scheduled turn-off, and a hand-sent "turn_on" does not
        arm one: the scheduled moment is measured from the last print, and a
        button press is not a print.


        The HTTP status is about the request, not about the relay. A relay that
        refused the webhook, answered 401 or never answered at all is reported
        with 200 and `success: false`, carrying the error, because that is the
        outcome the caller asked to find out. 400 means nothing was sent.
      operationId: api.printer_controller.send_relay_power_webhook
      tags:
        - printer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayPowerSendRequest'
      responses:
        '200':
          description: >-
            The webhook was attempted. `success` says whether the relay confirmed
            it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayPowerSendResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /text/print:
    post:
      summary: Print text on a label
      description: >-
        Prints formatted text on a label with specified settings. On continuous
        media, settings.orientation can run the text lengthwise along the tape
        so a long message prints as one continuous strip.
      operationId: api.text_controller.print_text
      tags:
        - text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextPrintRequest'
      responses:
        '200':
          description: Text printed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /text/preview:
    post:
      summary: Render a server-side preview of a text label
      description: >-
        Runs the same render pipeline as /text/print (fonts, layout, rotation
        and 1-bit black/white conversion) but returns the rendered label as a
        PNG data URL instead of printing it.
      operationId: api.preview_controller.preview_text
      tags:
        - preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextPrintRequest'
      responses:
        '200':
          description: Text preview rendered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /image/print:
    post:
      summary: Print image on a label
      description: Prints an uploaded image on a label with specified settings
      operationId: api.image_controller.print_image
      tags:
        - image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: The image file to print
                settings:
                  type: string
                  description: JSON string containing print settings
                  example: '{"printer_uri": "tcp://192.168.1.100", "label_size": "62"}'
                confirm_large_batch:
                  type: string
                  description: >-
                    Set to "true" to confirm large batches. Required when
                    settings.copies >= 10, otherwise the request is rejected
                    with code CONFIRMATION_REQUIRED.
                  example: "true"
                dry_run:
                  type: string
                  description: >-
                    Set to "true" to validate only (check settings + printer
                    reachability) without saving or printing.
                  example: "true"
              required:
                - image
      responses:
        '200':
          description: Image printed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintResponse'
        '400':
          description: >-
            Invalid request parameters, or an image larger than the server's
            pixel limit. The limit defaults to 50000000 pixels (50 MP) and is
            configured with the MAX_UPLOAD_IMAGE_PIXELS environment variable
            (0 removes it). The error message names both the limit and the
            image's actual dimensions and pixel count; details carries width,
            height, pixels and limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "VALIDATION_ERROR"
                message: "Image is too large to print: 8000x8000 is 64000000 pixels, more than the limit of 50000000. Scale the image down, or raise MAX_UPLOAD_IMAGE_PIXELS (0 removes the limit)."
                details:
                  field: "image"
                  width: 8000
                  height: 8000
                  pixels: 64000000
                  limit: 50000000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /image/preview:
    post:
      summary: Render a server-side preview of an image label
      description: >-
        Runs the same render pipeline as /image/print (resize to label width,
        rotation and 1-bit black/white conversion) but returns the rendered
        label as a PNG data URL instead of printing it.
      operationId: api.preview_controller.preview_image
      tags:
        - preview
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: The image file to preview
                settings:
                  type: string
                  description: JSON string containing print settings
                  example: '{"printer_uri": "tcp://192.168.1.100", "label_size": "62"}'
              required:
                - image
      responses:
        '200':
          description: Image preview rendered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewResponse'
        '400':
          description: >-
            Invalid request parameters, or an image larger than the server's
            pixel limit. A preview decodes exactly what a print decodes, so the
            same limit applies: 50000000 pixels (50 MP) by default, configured
            with the MAX_UPLOAD_IMAGE_PIXELS environment variable (0 removes
            it).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "VALIDATION_ERROR"
                message: "Image is too large to print: 8000x8000 is 64000000 pixels, more than the limit of 50000000. Scale the image down, or raise MAX_UPLOAD_IMAGE_PIXELS (0 removes the limit)."
                details:
                  field: "image"
                  width: 8000
                  height: 8000
                  pixels: 64000000
                  limit: 50000000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pdf/print:
    post:
      summary: Print a PDF on labels
      description: Prints an uploaded PDF document on labels with specified settings
      operationId: api.pdf_controller.print_pdf
      tags:
        - pdf
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF file to print
                settings:
                  type: string
                  description: JSON string containing print settings
                  example: '{"printer_uri": "tcp://192.168.1.100", "printer_model": "QL-800", "label_size": "62"}'
                pages:
                  type: string
                  description: >-
                    Optional page selection (e.g. "1-3,5"); empty means all
                    pages. The selection is what counts against the server's
                    page limit, so a range is the way to print part of a long
                    document.
                  example: "1-3,5"
                scale_mode:
                  type: string
                  description: How to scale each page onto the label
                  enum: [fit, fill]
                  default: fit
                  example: "fit"
                confirm_large_batch:
                  type: string
                  description: >-
                    Set to "true" to confirm large batches. Required when
                    settings.copies >= 10, otherwise the request is rejected
                    with code CONFIRMATION_REQUIRED.
                  example: "true"
                dry_run:
                  type: string
                  description: >-
                    Set to "true" to validate only (check settings + printer
                    reachability) without saving or printing.
                  example: "true"
              required:
                - file
      responses:
        '200':
          description: PDF printed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintResponse'
        '400':
          description: >-
            Invalid request parameters, or a selection of more pages than the
            server renders in one job. Every selected page is rasterised into
            memory before the first label is sent, so the limit defaults to 20
            pages and is configured with the MAX_PDF_PAGES environment variable
            (0 removes it). The error message names both the limit and the
            number of pages requested; details carries requested_pages,
            total_pages and limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "VALIDATION_ERROR"
                message: "This PDF would print 40 pages, more than the limit of 20. Select fewer pages with the 'pages' field, or raise MAX_PDF_PAGES (0 removes the limit)."
                details:
                  field: "pages"
                  requested_pages: 40
                  total_pages: 40
                  limit: 20
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pdf/preview:
    post:
      summary: Render a server-side preview of a PDF
      description: >-
        Renders the selected pages of an uploaded PDF as small PNG thumbnails
        (data URLs) without printing. Uses a low DPI and caps the number of
        rendered pages so previewing large PDFs stays fast. The preview
        truncates (see the truncated flag) and never rejects; the page limit
        that can reject a job (MAX_PDF_PAGES) applies to /pdf/print only.
      operationId: api.pdf_controller.preview_pdf
      tags:
        - pdf
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF file to preview
                pages:
                  type: string
                  description: Optional page selection (e.g. "1-3,5"); empty means all pages
                  example: "1-3,5"
              required:
                - file
      responses:
        '200':
          description: PDF preview rendered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /share:
    post:
      summary: Share a file into the app
      description: >-
        Accepts a file (PDF or image) shared from another app and stages it for
        the web UI. Responds with a redirect to the UI, which loads the staged
        file into the print dialog.
      operationId: api.share_controller.share
      tags:
        - share
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The shared file (PDF or image)
              required:
                - file
      responses:
        '302':
          description: Redirect to UI with staged file
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /share/{token}:
    get:
      summary: Retrieve a staged shared file
      description: Serves a previously staged file by its token
      operationId: api.share_controller.get_shared
      tags:
        - share
      parameters:
        - name: token
          in: path
          required: true
          description: Staging token for the shared file (hex, optional extension)
          schema:
            type: string
      responses:
        '200':
          description: The staged file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /qrcode/print:
    post:
      summary: Print QR code on a label
      description: Generates and prints a QR code on a label with specified settings
      operationId: api.qrcode_controller.print_qr_code
      tags:
        - qrcode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRCodePrintRequest'
      responses:
        '200':
          description: QR code printed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
          
  /qrcode/preview:
    post:
      summary: Render a server-side preview of a QR code label
      description: >-
        Runs the same render pipeline as /qrcode/print (QR generation, optional
        text composition, rotation and 1-bit black/white conversion) but returns
        the rendered label as a PNG data URL instead of printing it.
      operationId: api.preview_controller.preview_qrcode
      tags:
        - preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRCodePrintRequest'
      responses:
        '200':
          description: QR code preview rendered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /label/text-qrcode:
    post:
      summary: Print label with text and QR code
      description: Prints a label with text on the left (2/3) and QR code on the right (1/3)
      operationId: api.label_controller.print_text_qrcode_label
      tags:
        - label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextQRCodeLabelRequest'
      responses:
        '200':
          description: Label printed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /label/text-image:
    post:
      summary: Print label with text and an uploaded image
      description: >-
        Prints a label with an uploaded image and a text block side by side.
        The image is placed on the side selected by ``position`` (left or
        right) and the text block on the opposite side.
      operationId: api.text_image_controller.print_text_image
      tags:
        - label
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: The image file to place beside the text
                text:
                  type: string
                  description: Text content to render alongside the image
                  example: "Product: Widget XYZ"
                font_size:
                  type: integer
                  description: Font size for the text
                  default: 30
                  example: 30
                alignment:
                  type: string
                  description: Horizontal alignment of the text
                  enum: [left, center, right]
                  default: left
                  example: "left"
                position:
                  type: string
                  description: Position of the image relative to the text
                  enum: [left, right]
                  default: right
                  example: "right"
                settings:
                  type: string
                  description: JSON string containing print settings
                  example: '{"printer_uri": "tcp://192.168.1.100", "printer_model": "QL-800", "label_size": "62"}'
                confirm_large_batch:
                  type: string
                  description: >-
                    Set to "true" to confirm large batches. Required when
                    settings.copies >= 10, otherwise the request is rejected
                    with code CONFIRMATION_REQUIRED.
                  example: "true"
                dry_run:
                  type: string
                  description: >-
                    Set to "true" to validate only (check settings + printer
                    reachability) without saving or printing.
                  example: "true"
              required:
                - image
                - text
      responses:
        '200':
          description: Label printed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintResponse'
        '400':
          description: >-
            Invalid request parameters, or an image larger than the server's
            pixel limit (50000000 pixels by default, configured with the
            MAX_UPLOAD_IMAGE_PIXELS environment variable; 0 removes it). The
            error message names both the limit and the image's actual size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "VALIDATION_ERROR"
                message: "Image is too large to print: 8000x8000 is 64000000 pixels, more than the limit of 50000000. Scale the image down, or raise MAX_UPLOAD_IMAGE_PIXELS (0 removes the limit)."
                details:
                  field: "image"
                  width: 8000
                  height: 8000
                  pixels: 64000000
                  limit: 50000000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /label/preview:
    post:
      summary: Render a server-side preview of a text + QR code label
      description: >-
        Runs the same render pipeline as /label/text-qrcode (side-by-side text
        and QR composition, rotation and 1-bit black/white conversion) but
        returns the rendered label as a PNG data URL instead of printing it.
      operationId: api.preview_controller.preview_label
      tags:
        - preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextQRCodeLabelRequest'
      responses:
        '200':
          description: Label preview rendered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calibration/test-print:
    post:
      summary: Print a calibration target
      description: >-
        Prints the alignment calibration target on the selected medium, with the
        calibration offset currently in force applied to it, so the target's
        subject is where the ink lands, so it is the one print that is
        deliberately shifted. The target carries a ring (round media) or frame
        (rectangular and continuous media) at the edge of the printable area, a
        centre crosshair, a millimetre scale (a mark every millimetre, every
        fifth one long) and a caption naming the label and the offset it was
        printed with. Read the error as half the difference between two opposite
        gaps, store it via PUT /settings, print again.


        Setting `sweep` turns this into a one-pass calibration: it prints
        several numbered targets whose offsets step around the current value, so
        the user picks the one that looks centred instead of iterating. It is
        opt-in because every step costs a physical label, and `copies` is forced
        to 1 for its duration.


        The response reports the offsets that will actually reach the paper:
        sideways travel is bounded by how much print head there is beside the
        loaded media, so a request beyond it is clamped, and `clamped`,
        `requested_offsets_mm` and `sideways_travel_mm` say so. The printed
        target captions itself with the applied offset for the same reason.


        The job goes through the print queue like every other print endpoint;
        `dry_run` validates and renders without printing (its `would_print`
        object additionally reports the number of `labels` the run would use,
        plus the same offset/clamp/travel fields).
      operationId: api.calibration_controller.test_print_calibration
      tags:
        - calibration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalibrationTestPrintRequest'
      responses:
        '200':
          description: Calibration target queued for printing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalibrationPrintResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calibration/preview:
    post:
      summary: Render a server-side preview of the calibration target
      description: >-
        Renders the same target as /calibration/test-print and returns it as a
        PNG data URL instead of printing it. Unlike the other preview endpoints
        this one applies the calibration offset, because the shifted result is
        exactly what the target is for. Being a picture, it shows both axes
        moved inside the label: it has no print head to slide the raster along,
        so a sideways offset it shows running past the edge is content landing
        off the die cut rather than content the printer refuses to lay down.
        It shows the *applied* offset and the size correction, in the same
        order the print path applies them, so that the preview of a target
        agrees with the target, and with the caption both of them carry.
      operationId: api.calibration_controller.preview_calibration
      tags:
        - calibration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalibrationPreviewRequest'
      responses:
        '200':
          description: Calibration target rendered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /settings:
    get:
      summary: Get current settings
      description: Returns the current global settings
      operationId: api.settings_controller.get_settings
      tags:
        - settings
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    put:
      summary: Update settings
      description: Updates the global settings
      operationId: api.settings_controller.update_settings
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: Settings updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs:
    get:
      summary: List print jobs
      description: Returns the most recent print-queue jobs (newest first)
      operationId: api.jobs_controller.list_jobs
      tags:
        - jobs
      responses:
        '200':
          description: List of print jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/{job_id}:
    get:
      summary: Get a print job
      description: Returns the status of a single print job
      operationId: api.jobs_controller.get_job
      tags:
        - jobs
      parameters:
        - name: job_id
          in: path
          required: true
          description: Identifier of the print job
          schema:
            type: string
      responses:
        '200':
          description: Print job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/{job_id}/cancel:
    post:
      summary: Cancel a print job
      description: Cancels a print job if it is still queued
      operationId: api.jobs_controller.cancel_job
      tags:
        - jobs
      parameters:
        - name: job_id
          in: path
          required: true
          description: Identifier of the print job
          schema:
            type: string
      responses:
        '200':
          description: Cancellation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled:
                    type: boolean
                    description: Whether the job was cancelled (only queued jobs can be cancelled)
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/{job_id}/reprint:
    post:
      summary: Reprint a print job
      description: >-
        Re-queues a previous job's executor as a new job, reusing the same
        inputs (and persisted file for image/pdf jobs).
      operationId: api.jobs_controller.reprint_job
      tags:
        - jobs
      parameters:
        - name: job_id
          in: path
          required: true
          description: Identifier of the print job to reprint
          schema:
            type: string
      responses:
        '200':
          description: New job id created for the reprint
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    description: Identifier of the newly created reprint job
                    example: "9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/{job_id}/file:
    get:
      summary: Download a print job's file
      description: >-
        Returns the persisted image/pdf file backing a job. Responds 404 when
        no file is associated or it has expired (TTL sweep).
      operationId: api.jobs_controller.get_job_file
      tags:
        - jobs
      parameters:
        - name: job_id
          in: path
          required: true
          description: Identifier of the print job
          schema:
            type: string
      responses:
        '200':
          description: The persisted job file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/clear:
    post:
      summary: Clear finished print jobs
      description: Removes all jobs in a terminal state (done, failed, cancelled)
      operationId: api.jobs_controller.clear_jobs
      tags:
        - jobs
      responses:
        '200':
          description: Number of cleared jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  cleared:
                    type: integer
                    description: Number of finished jobs removed from the registry
                    example: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/clear-all:
    post:
      summary: Clear all print jobs
      description: >-
        Cancels every queued job and removes all jobs from the registry, except
        a job that is currently printing (it is kept so its result is recorded).
      operationId: api.jobs_controller.clear_all_jobs
      tags:
        - jobs
      responses:
        '200':
          description: Number of cleared jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  cleared:
                    type: integer
                    description: Number of jobs removed from the registry
                    example: 5
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/{job_id}/delete:
    post:
      summary: Delete a print job
      description: >-
        Deletes a single job. A queued job is cancelled and removed; a finished
        job is removed. A job currently printing cannot be deleted.
      operationId: api.jobs_controller.delete_job
      tags:
        - jobs
      parameters:
        - name: job_id
          in: path
          required: true
          description: Identifier of the print job to delete
          schema:
            type: string
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: boolean
                    description: Whether the job was removed (a printing job cannot be removed)
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/queue:
    get:
      summary: Get print-queue control status
      description: Returns whether the queue is paused plus queued/printing counts
      operationId: api.jobs_controller.get_queue_status
      tags:
        - jobs
      responses:
        '200':
          description: Queue control status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/pause:
    post:
      summary: Pause the print queue
      description: >-
        Pauses processing. A job already printing finishes; subsequent jobs are
        held until the queue is resumed.
      operationId: api.jobs_controller.pause_queue
      tags:
        - jobs
      responses:
        '200':
          description: Queue control status after pausing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/resume:
    post:
      summary: Resume the print queue
      description: Resumes a previously paused queue
      operationId: api.jobs_controller.resume_queue
      tags:
        - jobs
      responses:
        '200':
          description: Queue control status after resuming
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/stop:
    post:
      summary: Stop the print queue
      description: >-
        Emergency stop: pauses the queue and cancels every queued job. A job
        currently printing still finishes.
      operationId: api.jobs_controller.stop_queue
      tags:
        - jobs
      responses:
        '200':
          description: Queue control status after stopping (with cancelled count)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/QueueStatus'
                  - type: object
                    properties:
                      cancelled:
                        type: integer
                        description: Number of queued jobs cancelled by the stop
                        example: 4
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  # The global `security:` above references this scheme so the Swagger UI shows
  # an "Authorize" button. Actual enforcement is the Flask before_request hook
  # (see register_auth in app.py), opt-in via the API_KEY env var; connexion
  # itself does not enforce it (no x-apikeyInfoFunc), and the hook keeps the UI,
  # the spec and the health endpoints reachable without a key.
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        Optional API key. When the API_KEY environment variable is set on the
        server, send the matching key in the X-API-Key header for all
        /api/v1/* requests (UI, Swagger UI and health endpoints are exempt).
  schemas:
    JobStatus:
      type: object
      description: Status of a single print-queue job
      properties:
        id:
          type: string
          description: Unique job identifier (uuid hex)
          example: "3f2a1b9c4d5e6f708192a3b4c5d6e7f8"
        type:
          type: string
          description: Job type tag (e.g. text, image, qrcode, pdf, label)
          example: "text"
        status:
          type: string
          description: Current job status
          enum:
            - queued
            - printing
            - done
            - failed
            - cancelled
          example: "queued"
        label:
          type: string
          description: Human-readable label describing the job
          example: "Hello World"
        created_at:
          type: string
          format: date-time
          description: ISO-8601 timestamp when the job was created
          example: "2026-06-14T12:00:00+00:00"
        started_at:
          type: string
          format: date-time
          nullable: true
          description: ISO-8601 timestamp when the job started printing (null until started)
          example: "2026-06-14T12:00:01+00:00"
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: ISO-8601 timestamp when the job finished (null until finished)
          example: "2026-06-14T12:00:03+00:00"
        error:
          type: string
          nullable: true
          description: Error message when the job failed (null otherwise)
          example: null
        params:
          type: object
          additionalProperties: true
          description: >-
            Serializable inputs describing the job (e.g. text/settings or
            filename/settings/pages); used to re-open or reprint the job.
        can_reprint:
          type: boolean
          description: Whether a stored executor still exists so the job can be reprinted
          example: true
        activity:
          type: string
          nullable: true
          description: >-
            What is happening to this job right now, alongside (not instead of)
            `status`. A job held before printing while the printer's mains
            supply is switched on and the device boots stays `queued` — which is
            what it is — and names the phase here. Null when nothing in
            particular is happening, which is the ordinary case for a job simply
            waiting its turn, and always null once the job has finished. A
            failure while waiting is described by `error`, not by a lingering
            activity.

            `retrying` belongs to a job whose print attempt failed at a printer
            this app had just switched on: it is tried three times over 45s
            before the failure is the job's, and it goes back to `queued`
            between attempts — it is not on the wire, and it can still be
            cancelled. A job at a printer that was already up is never retried.
          enum:
            - "switching_on"
            - "waiting_for_printer"
            - "printer_settling"
            - "printing"
            - "retrying"
            - null
          example: "waiting_for_printer"
        activity_message:
          type: string
          nullable: true
          description: >-
            The activity in plain words, ready to display. May name concrete
            durations and so is not stable enough to branch on — switch on
            `activity` for that.
          example: "Switched on at the relay. Leaving the printer alone for 20s while it boots."
        activity_at:
          type: string
          format: date-time
          nullable: true
          description: ISO-8601 timestamp when the current activity began (null when there is none)
          example: "2026-06-14T12:00:01+00:00"
      required:
        - id
        - type
        - status
        - label
        - created_at

    QueueStatus:
      type: object
      description: Print-queue control status
      properties:
        paused:
          type: boolean
          description: Whether the queue is currently paused
          example: false
        queued:
          type: integer
          description: Number of jobs currently waiting in the queue
          example: 0
        printing:
          type: integer
          description: Number of jobs currently printing (0 or 1)
          example: 0
        activity:
          type: string
          nullable: true
          description: >-
            What the job currently being processed is doing, if anything. The
            same value that job reports under `GET /jobs`, read from the same
            place. A job waiting for its printer to be switched on and boot is
            counted under `queued`, so without this the queue looks idle while
            it is busy waiting.
          enum:
            - "switching_on"
            - "waiting_for_printer"
            - "printer_settling"
            - "printing"
            - "retrying"
            - null
          example: "waiting_for_printer"
        activity_message:
          type: string
          nullable: true
          description: The current activity in plain words, ready to display
          example: "Waiting for the printer to come up."
        activity_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            ISO-8601 timestamp when the current activity began (null when there
            is none). Carried here as well as on the job so a client can show
            how long the phase has been running without also fetching the job
            list.
          example: "2026-06-14T12:00:01+00:00"
        activity_job_id:
          type: string
          nullable: true
          description: Identifier of the job the activity belongs to (null when there is no activity)
          example: "3f2a1b9c4d5e6f708192a3b4c5d6e7f8"
      required:
        - paused
        - queued
        - printing

    KeepAliveStatus:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether keep alive is enabled in settings
          example: true
        interval:
          type: integer
          description: Interval between pings in seconds
          example: 60
        running:
          type: boolean
          description: Whether the keep alive thread is currently running
          example: true

    RelayPowerStatus:
      type: object
      description: >-
        The state of relay power control and the timing chain it derives from
        the settings. Every duration is in seconds; every moment is a unix
        timestamp.
      properties:
        enabled:
          type: boolean
          description: Whether relay power control is switched on.
          example: false
        turn_off_enabled:
          type: boolean
          description: Whether the "turn_off" half of the feature is switched on.
          example: false
        turn_on_url_configured:
          type: boolean
          description: >-
            Whether a turn_on URL is set. The URL itself is not returned; it can
            carry a token in its query string, and this endpoint is about state.
          example: false
        turn_off_url_configured:
          type: boolean
          description: >-
            Whether a URL is available for turn_off, counting the fallback to the
            turn_on URL.
          example: false
        authorization_configured:
          type: boolean
          description: >-
            Whether RELAY_WEBHOOK_AUTHORIZATION is set in the environment, so an
            Authorization header will be sent. The value itself is never returned.
          example: false
        printer_auto_power_off_minutes:
          type: integer
          description: The printer's own auto-power-off interval as configured.
          example: 10
        configured_window_seconds:
          type: integer
          nullable: true
          description: >-
            The window the user asked for, measured from the last print. Null
            when no timed keep-alive window is in force, in which case nothing is
            scheduled.
          example: 14400
        effective_keep_alive_seconds:
          type: integer
          nullable: true
          description: >-
            How long the keep-alive heartbeat actually runs after a print. While
            relay power control is on this is the configured window minus the
            printer's own auto-power-off interval, so the device sleeps at
            exactly the configured moment; while it is off it is the configured
            window unchanged. Zero is a real answer, not a disabled feature — it
            means the hardware timer carries the whole window. Null when the
            heartbeat runs continuously.


            Read hardware_offset_applied before describing this number as a
            subtraction.
          example: 13800
        hardware_offset_applied:
          type: boolean
          description: >-
            Whether printer_auto_power_off_minutes was actually subtracted to
            produce effective_keep_alive_seconds. True only while relay power
            control is on and a timed keep-alive window exists.


            It is reported rather than left to be inferred because the
            subtraction cannot be read back out of the numbers: with the feature
            off, effective_keep_alive_seconds equals configured_window_seconds,
            which is indistinguishable from a subtraction of zero. A client that
            guessed would explain the moment the heartbeat stops as "the window
            minus the device's own interval" in the one case where no such
            subtraction happened.
          example: true
        printer_power_off_seconds:
          type: integer
          nullable: true
          description: >-
            When the printer's own timer expires, in seconds from the last
            print. The device starts counting when the heartbeat stops, so this
            is effective_keep_alive_seconds plus the configured device interval.


            It equals configured_window_seconds while hardware_offset_applied is
            true, and exceeds it by that interval while it is false: a 4 h window
            with a 10 min device timer means 4:00 with relay power control on and
            4:10 with it off. Null when no timed window applies, in which case
            the heartbeat never stops on its own.


            As reliable as printer_auto_power_off_minutes is, and nothing
            verifies that: see `warning`.
          example: 14400
        turn_off_delay_seconds:
          type: integer
          description: The safety margin between the window closing and turn_off.
          example: 300
        server_time:
          type: number
          format: double
          description: >-
            The server's own clock at the moment this response was built, as a
            unix timestamp. Every absolute moment below is on this clock and
            every seconds-until is measured from it, so a client can work out its
            skew once and read the whole chain in its own time.


            It is not the only way to do that: each moment also carries its own
            seconds-until, so a countdown can be anchored per moment rather than
            inheriting the error of one shared pair.
          example: 1767211200.0
        origin_at:
          type: number
          format: double
          nullable: true
          description: >-
            The moment the chain shown below is measured from, as a unix
            timestamp. Usually the value the keep-alive worker measures its
            window from; the current time while origin_source is "idle". Null
            only when it could not be read at all, in which case every clock
            time below is null too rather than drawn from a guess.
          example: 1767207600.0
        origin_at_iso:
          type: string
          nullable: true
          description: The same moment as ISO-8601 UTC, for display and for logs.
          example: "2026-01-01T11:00:00+00:00"
        origin_source:
          type: string
          nullable: true
          description: >-
            What that moment actually is, and it has to be read before the
            moment is labelled.


            "print" — something really printed, and the chain is running from
            it. "startup" — nothing has printed since the app came up, so the
            window runs from the process start time; that is the deliberate
            fallback which gives keep-alive one window immediately, and the
            heartbeat really does run it. "idle" — that window has since run
            out, so the chain is shown from the current time rather than from a
            moment hours or days behind, which is the same "no window running,
            start one from now" rule applied a second time.


            While it is "idle" the moments below are a projection of the window
            a print landing now would open, not a schedule: nothing is running
            and nothing is armed. scheduled_turn_off_at stays null throughout,
            because the one step that can cut mains power is never given a time
            it has not been armed for.


            Showing "startup" or "idle" as "Last print 13:42" states a print
            that never happened. Use last_print_at for that question.
          # Quoted for the same reason mains_power's enum is: YAML reads some
          # bare words as other types, and an enum that changed type under it
          # would reject every real response.
          enum: ["print", "startup", "idle", null]
          example: "idle"
        seconds_since_origin:
          type: number
          format: double
          nullable: true
          description: >-
            How long ago that moment was, counting up. Never negative. The
            relative half of the origin's pair, so a display can tick without
            re-reading the clock. Zero while origin_source is "idle", since the
            origin is then the current time.
          example: 3600.0
        last_print_at:
          type: number
          format: double
          nullable: true
          description: >-
            When the printer last actually printed, as a unix timestamp, or null
            when it has not printed since the app came up.


            Reported separately from origin_at precisely because the origin can
            be re-based away from it: "the chain runs from here" and "the printer
            last did something here" are different questions, and only one of
            them has an answer while the app is idle. This is the field to label
            "Last print"; it is null exactly when there was no last print.
          example: 1766949600.0
        last_print_at_iso:
          type: string
          nullable: true
          description: The same moment as ISO-8601 UTC.
          example: "2025-12-28T18:00:00+00:00"
        seconds_since_last_print:
          type: number
          format: double
          nullable: true
          description: >-
            How long ago the last print was, counting up, or null when there has
            not been one. Its absolute half is last_print_at.
          example: 261600.0
        keep_alive_ends_at:
          type: number
          format: double
          nullable: true
          description: >-
            When the keep-alive heartbeat stops, as a unix timestamp: origin_at
            plus effective_keep_alive_seconds, so the hardware offset is already
            inside it and hardware_offset_applied still says whether it was
            taken.


            Null unless a timed keep-alive window is configured and switched on
            — no timed mode, a zero duration, or keep-alive switched off
            entirely all mean there is no such moment. A heartbeat that is not
            running does not stop at a time, and naming one would put a clock
            time on an event that will not occur. Note that
            effective_keep_alive_seconds answers the arithmetic in one of those
            cases anyway (it describes the window a timed configuration would
            run, and never consults the enabled flag); this field is about the
            clock, and is stricter for it.


            While origin_source is "idle" this is a projection: the moment the
            heartbeat would stop had a print landed now.
          example: 1767221400.0
        keep_alive_ends_at_iso:
          type: string
          nullable: true
          description: The same moment as ISO-8601 UTC.
          example: "2026-01-01T14:50:00+00:00"
        seconds_until_keep_alive_end:
          type: number
          format: double
          nullable: true
          description: >-
            Seconds remaining until it, clamped at zero once it has passed, or
            null when the moment is null. Pair it with keep_alive_ends_at to
            correct for clock skew; compare that moment with server_time to see
            how long ago it passed.
          example: 10200.0
        printer_power_off_at:
          type: number
          format: double
          nullable: true
          description: >-
            When the printer's own timer expires, as a unix timestamp:
            origin_at plus printer_power_off_seconds. With relay power control
            on that lands on the configured window; with it off it lands on the
            configured window plus the device's own interval, because nothing
            was subtracted from the heartbeat and the device starts counting
            only once the heartbeat stops.


            Null under the same rule as keep_alive_ends_at, and for the same
            reason: the device starts counting when the heartbeat stops, so with
            no heartbeat running there is nothing to count from.


            As reliable as printer_auto_power_off_minutes is, and nothing
            verifies that: see `warning`.
          example: 1767222000.0
        printer_power_off_at_iso:
          type: string
          nullable: true
          description: The same moment as ISO-8601 UTC.
          example: "2026-01-01T15:00:00+00:00"
        seconds_until_printer_power_off:
          type: number
          format: double
          nullable: true
          description: Seconds remaining until it, clamped at zero, or null.
          example: 10800.0
        scheduled_turn_off_at:
          type: number
          format: double
          nullable: true
          description: >-
            When the turn_off webhook is next due, as a unix timestamp, or null
            when nothing is scheduled. Persisted, so it survives a restart.


            The last step of the chain, and the one moment that is not
            origin_at plus an offset. It is armed by a print and pushed out
            again by anything queued or printing, so it can sit further out than
            the arithmetic would suggest — and it is null while nothing has
            armed it, including after a restart with nothing printed since,
            which is precisely when no turn_off is going to be sent. A time
            shown for it then would be a time for something that will not
            happen. It is never projected either, not even while origin_source
            is "idle": the one step that can cut mains power only ever carries a
            time it has actually been armed for.


            It can be in the past — a moment that fell due while the app was
            down, before the scheduler's first tick — and that is reported as it
            stands, because it really is about to be sent.
          example: 1767226500.0
        scheduled_turn_off_at_iso:
          type: string
          nullable: true
          description: The same moment as ISO-8601 UTC.
          example: "2026-01-01T16:15:00+00:00"
        seconds_until_turn_off:
          type: number
          format: double
          nullable: true
          description: Seconds remaining until that moment, clamped at zero, or null.
          example: 14700.0
        next_step:
          type: string
          nullable: true
          description: >-
            Which step the chain is waiting on as of server_time, or null when
            none is outstanding — every remaining step has passed, or the chain
            does not apply.


            Decided here rather than left to the client on purpose. Picking the
            soonest of three timestamps is arithmetic anyone can do; knowing
            which of the three steps exists at all is settings logic — a window
            that is not running has no end, a turn_off that is not armed has no
            moment, and the hardware offset moves one moment without moving
            another. Answered once, on the side that already holds those rules,
            every client agrees.


            It does not go stale between polls either, because it is not a claim
            about the future: every moment is in this payload absolutely, so a
            client ticking locally past a boundary can advance the highlight
            itself.
          # Quoted deliberately; see origin_source.
          enum: ["keep_alive_end", "printer_power_off", "turn_off", null]
          example: "keep_alive_end"
        next_step_at:
          type: number
          format: double
          nullable: true
          description: >-
            That step's moment, repeated here so a client does not have to map
            the key back to a field to render "next: …". Always equal to the
            field it names.
          example: 1767221400.0
        next_step_at_iso:
          type: string
          nullable: true
          description: The same moment as ISO-8601 UTC.
          example: "2026-01-01T14:50:00+00:00"
        seconds_until_next_step:
          type: number
          format: double
          nullable: true
          description: Seconds remaining until it, or null when there is no next step.
          example: 10200.0
        last_action:
          type: string
          nullable: true
          description: The most recent webhook that was delivered successfully.
          enum: [turn_on, turn_off, null]
          example: null
        last_action_at:
          type: string
          nullable: true
          description: When that webhook was sent (ISO-8601 UTC).
          example: null
        last_error:
          type: string
          nullable: true
          description: >-
            The most recent webhook failure, or null. A webhook that could not be
            delivered is reported here as well as logged — it is never treated as
            one that was.
          example: null
        last_error_at:
          type: string
          nullable: true
          description: When that failure happened (ISO-8601 UTC).
          example: null
        warning:
          type: string
          description: >-
            Always present. Names the one thing the app cannot verify — that
            printer_auto_power_off_minutes matches the device — and what happens
            if it does not. Sent unconditionally because the moment it is most
            needed is while someone decides whether to arm the turn-off;
            withholding it until they have would be exactly backwards. Display
            it where the setting is made.
          example: >-
            This app cannot read or change the printer's built-in auto-power-off
            time. The value configured here is a statement about the device
            rather than a setting on it…
        warning_armed:
          type: boolean
          description: >-
            Whether the warning describes a live hazard (relay control and its
            turn_off half both on) rather than a caution about what arming it
            would mean. Lets a client show the same wording at two weights.
          example: false

    RelayPowerSendRequest:
      type: object
      description: Which webhook to send now.
      properties:
        action:
          type: string
          description: >-
            "turn_on" closes the relay, "turn_off" opens it and cuts mains power
            to the printer. Both send the same body the print path sends, so what
            is tested here is what will happen in earnest.
          enum: [turn_on, turn_off]
          example: turn_on
      required:
        - action

    RelayPowerSendResponse:
      type: object
      description: >-
        What was sent, where, what came back, and what it means for the
        printer's power.
      properties:
        success:
          type: boolean
          description: >-
            Whether the relay confirmed the webhook with a 2xx response. False
            means the request was made but not confirmed, and `error` says why.
          example: true
        action:
          type: string
          description: The action that was sent.
          enum: [turn_on, turn_off]
          example: turn_on
        url:
          type: string
          description: >-
            The URL the webhook went to, after the turn_off fallback to the
            turn_on URL has been applied. Returned here, unlike on the status
            endpoint, because a report about one specific request has to name
            its destination; the same string is already returned verbatim by
            GET /settings, so nothing is exposed that the caller cannot read
            there.
          example: "http://192.168.1.42/relay/0?turn=on"
        payload:
          type: object
          additionalProperties: true
          description: >-
            The exact JSON body that was POSTed. Present whether or not delivery
            succeeded, because "what did you actually send" is the first question
            when a relay flow does not react.
          example:
            action: turn_on
            source: brother_ql_app
            printer_uri: "tcp://192.168.1.100"
            printer_model: "QL-800"
            timestamp: "2026-01-01T12:00:00+00:00"
        authorization_sent:
          type: boolean
          description: >-
            Whether an Authorization header went with the request, i.e. whether
            RELAY_WEBHOOK_AUTHORIZATION is set. The value itself is never
            returned. It is reported because a 401 from the relay and a missing
            credential are the same fault seen from two ends.
          example: false
        response_status:
          type: integer
          nullable: true
          description: >-
            The HTTP status the relay answered with, on success and on an HTTP
            failure alike. Null when nothing came back at all, which is itself
            the answer: the request never reached anything.
          example: 200
        sent_at:
          type: string
          description: >-
            When the request went out (ISO-8601 UTC). The same value the payload
            carries, so a relay log can be lined up against this one.
          example: "2026-01-01T12:00:00+00:00"
        mains_power:
          type: string
          description: >-
            What the printer's mains supply was left in. "on" and "off" are
            reported only for a confirmed webhook. An unconfirmed one reports
            "unknown" rather than assuming nothing happened: the relay may have
            acted before the response failed, and a guess in either direction
            would be worse than saying so.
          # Quoted deliberately: YAML reads bare on and off as booleans,
          # so the enum silently became [true, false, "unknown"] and every
          # real response was rejected as non-conforming.
          enum: ["on", "off", "unknown"]
          example: "on"
        message:
          type: string
          description: >-
            The outcome in plain words, suitable for showing as-is. For a
            confirmed "turn_off" it says that mains power has been cut.
          example: >-
            turn_on was delivered to http://192.168.1.42/relay/0?turn=on. The
            relay answered HTTP 200. Mains power to the printer is on.
        error:
          type: string
          nullable: true
          description: >-
            Why the webhook was not confirmed, or null. Names the endpoint and
            the transport or HTTP failure, because a user testing a relay needs
            to see why it failed rather than only that it did.
          example: null
        schedule_changed:
          type: boolean
          description: >-
            Always false, and stated rather than left implicit: sending a webhook
            by hand never arms, clears or moves the scheduled turn-off.
          example: false
        scheduled_turn_off_at:
          type: number
          format: double
          nullable: true
          description: >-
            The scheduled turn-off moment as it stands, unchanged by this
            request, or null when nothing is scheduled.
          example: null

    KeepAliveRequest:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether to enable or disable keep alive
          example: true
          default: true
        interval:
          type: integer
          description: Interval between pings in seconds (minimum 10)
          example: 60
          default: 60
          minimum: 10
          maximum: 3600
      required:
        - enabled
    
    KeepAliveResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
          example: true
        message:
          type: string
          description: Status message
          example: "Keep alive started for tcp://192.168.1.100 with interval 60 seconds"
        enabled:
          type: boolean
          description: Whether keep alive is now enabled
          example: true
        interval:
          type: integer
          description: Current interval between pings in seconds
          example: 60
    Printer:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the printer
          example: "printer1"
        name:
          type: string
          description: Display name for the printer
          example: "Office Printer"
        printer_uri:
          type: string
          description: URI for connecting to the printer
          example: "tcp://192.168.1.100"
        printer_model:
          type: string
          description: Model of the Brother QL printer
          example: "QL-800"
        label_size:
          type: string
          description: Default label size for this printer
          example: "62"
      required:
        - id
        - printer_uri
        - printer_model
        - label_size

    PrinterStatusRequest:
      type: object
      properties:
        printer_uri:
          type: string
          description: URI for connecting to the printer (e.g., tcp://192.168.1.100)
          example: "tcp://192.168.1.100"
          default: "tcp://192.168.1.100"
        printer_model:
          type: string
          description: Model of the Brother QL printer (e.g., QL-800, QL-810W, QL-820NWB)
          example: "QL-800"
          default: "QL-800"
          enum: ["QL-500", "QL-550", "QL-560", "QL-570", "QL-580N", "QL-600", "QL-650TD", "QL-700", "QL-710W", "QL-720NW", "QL-800", "QL-810W", "QL-820NWB", "QL-1050", "QL-1060N", "QL-1100", "QL-1110NWB", "QL-1115NWB"]
        label_size:
          type: string
          description: >-
            Optional. Label identifier the loaded media should be compared
            against, reported back as media.matches_label_size. Omit it to use
            the configured label_size. The comparison is done here rather than
            in the client because the rules for it (which identifiers denote the
            same physical medium, which sizes cannot be told apart) belong with
            the label catalogue.
          example: "62"
          enum: ["12", "12+17", "18", "29", "38", "50", "54", "62", "62red", "102", "103", "104", "17x54", "17x87", "23x23", "29x42", "29x90", "39x90", "39x48", "52x29", "54x29", "60x86", "62x29", "62x100", "102x51", "102x152", "103x164", "d12", "d24", "d58"]
      required:
        - printer_uri
        - printer_model

    PrinterStatus:
      type: object
      properties:
        available:
          type: boolean
          description: >-
            Whether nothing known prevents the printer from printing. False when
            the device does not answer AND false when it reports a blocking
            condition such as an open cover or an empty media bay. This is
            narrower than it used to be: it previously meant only "the device
            answered", which is now carried by `reachable`.
          example: true
        reachable:
          type: boolean
          description: >-
            Whether the device answered at all. This is the reachability signal
            (used by the dry-run preflight and the keep-alive reporting); it
            stays true for a printer that is reachable but cannot print.
          example: true
        state:
          type: string
          description: >-
            Which question the answer actually settled. `ready` = answered and
            nothing blocking; `blocked` = answered and cannot print (see
            blocking_reasons); `unknown` = accepts a TCP connection but reports
            no status, so readiness is genuinely undetermined; `unreachable` =
            no answer.
          enum: [ready, blocked, unknown, unreachable]
          example: ready
        blocking_reasons:
          type: array
          description: >-
            Reported conditions preventing printing, as IPP state-reason
            keywords with the severity suffix removed (e.g. `cover-open`,
            `media-empty`). Empty when nothing blocks. A stopped printer that
            names no reason yields `printer-stopped`.
          items:
            type: string
          example: ["cover-open"]
        status:
          type: string
          description: Status message
          example: "Printer is ready"
        media:
          $ref: '#/components/schemas/LoadedMedia'
        details:
          type: object
          description: Additional status details
          additionalProperties: true

    LoadedMedia:
      type: object
      description: >-
        The media the printer reports as loaded, and which of this app's label
        identifiers it could be. Read over IPP from `media-ready`,
        `media-col-ready` and `printer-input-tray`; `media-default` is never
        used, as it was measured to keep reporting the factory value through
        every media change and with no roll loaded at all.
      properties:
        detected:
          type: boolean
          description: Whether a supported medium was identified.
          example: true
        detection:
          type: string
          description: >-
            Why there is (or is not) a reading. `ok` = identified;
            `unidentified` = media read but no supported label matches it;
            `no-media` = the printer answered and reports nothing loaded;
            `unreachable` = the printer did not answer; `unsupported` = this
            backend (USB, kernel device, or a network printer without IPP)
            cannot report media at all.
          enum: [ok, unidentified, no-media, unreachable, unsupported]
          example: ok
        width_mm:
          type: number
          nullable: true
          description: Reported media width in millimetres, null when unknown.
          example: 62
        length_mm:
          type: number
          nullable: true
          description: >-
            Reported media length in millimetres, 0 for continuous tape (which
            has no length of its own) and null when unknown.
          example: 0
        media_type:
          type: string
          nullable: true
          description: '`roll` for continuous tape, `labels` for die-cut media.'
          example: roll
        media_name:
          type: string
          nullable: true
          description: >-
            The tray's own name for the medium, e.g. `62mm / 2.4"` or
            `24mm Dia / 0.94" Dia`, where `Dia` marks round stock.
          example: '62mm / 2.4"'
        is_round:
          type: boolean
          nullable: true
          description: Whether the medium is round die-cut, null when not stated.
          example: false
        source:
          type: string
          nullable: true
          description: Which IPP attribute the size came from.
          enum: [media-col-ready, media-ready]
          example: media-col-ready
        candidates:
          type: array
          description: >-
            Every label identifier the reported media is consistent with, in
            catalogue order. More than one means the media genuinely cannot be
            told apart from what the printer reports: 62/62red are the same
            geometry with `mediacolor: unknown`, 12/12+17 are the same physical
            roll, and 103/104 differ by less than the reporting resolution.
            Empty when nothing was identified.
          items:
            type: string
          example: ["62", "62red"]
        ambiguous:
          type: boolean
          description: Whether more than one candidate remains possible.
          example: true
        reason:
          type: string
          description: Human-readable account of the match, or of why there is none.
          example: "62 mm continuous tape cannot be resolved further: 62 and 62red are the same geometry and the printer reports 'mediacolor: unknown', so the red tape cannot be distinguished"
        label_size:
          type: string
          nullable: true
          description: The label identifier the candidates were compared against.
          example: "62"
        matches_label_size:
          type: boolean
          nullable: true
          description: >-
            Whether label_size is among the candidates. Null, never false,
            when nothing could be identified, so "unknown" stays distinguishable
            from "they disagree".
          example: true
        resolution:
          $ref: '#/components/schemas/MediaResolution'
        auto_switch:
          $ref: '#/components/schemas/MediaAutoSwitch'

    MediaResolution:
      type: object
      description: >-
        Which single label identifier the candidates come down to, and how. This
        is reported whether or not media_auto_switch is on, because narrowing an
        ambiguous medium is useful to a client that wants to *offer* the switch
        rather than make it; `auto_switch` below is the only field that ever asks
        for one to be made.


        The steps are tried in a fixed order and the first that yields exactly
        one identifier wins: the variant declared for this medium
        (`media_preference`), then the label type last settled on for it
        (`media_memory`), then the one candidate the user says they own
        (`owned_media`), then the documented plain variant: 62 over 62red, 12
        over 12+17, 103 over 104. Each of the four is something the user said;
        none of them is a tie-break the app invented.


        The preference comes ahead of the memory deliberately. The memory is
        inferred: it is what happened last time. The preference is stated. A
        standing instruction that any single contrary pick could repeal would
        not be a standing instruction, so a run of plain 62 labels on a roll
        preferred as 62red is still remembered, it just does not outrank the
        preference.
      properties:
        label_size:
          type: string
          nullable: true
          description: >-
            The single identifier the medium resolves to, or **null** when it
            does not resolve to one, because no medium was detected or two candidates
            remain and nothing on record says which is loaded. Null is a result
            rather than a failure: it is what stops automatic mode from picking.
          example: "62red"
        resolved_by:
          type: string
          nullable: true
          description: >-
            Which step settled it, and therefore what a UI can say about why
            this candidate won. `detection` = the printer's report left only one
            possibility; `preference` = it is the variant set as preferred for
            this medium in media_preference; `memory` = this is what was last
            used on this medium; `owned` = it is the only candidate in
            owned_media; `default` = the documented plain variant of an
            ambiguous medium. Null when nothing settled it.
          enum: [detection, preference, memory, owned, default]
          nullable: true
          example: preference
        reason:
          type: string
          description: Why this candidate won, or why no candidate could.
          example: "62red is the variant set as preferred for this medium"

    MediaAutoSwitch:
      type: object
      description: >-
        What automatic media switching wants done about the loaded roll.


        **The server decides; the client applies.** label_size already has one
        writer, the client, through PUT /settings on every change, and a
        second writer here would be racing it from a status poll the UI makes
        every 30 seconds in however many tabs are open. A settings update is a
        read-modify-write of one JSON file, so a status check that wrote
        label_size could land between a user's edit and its save and quietly undo
        it. And POST /printers/status is a read: an orchestrator asking whether
        the printer is up should not find that the question changed the
        configuration. So the decision travels back with the status and the
        component that already owns the value carries it out.
      properties:
        enabled:
          type: boolean
          description: The media_auto_switch setting. False by default.
          example: false
        action:
          type: string
          description: >-
            `none` = do nothing (the feature is off, nothing is loaded, or the
            configured label type is already consistent with what is);
            `switch` = store `to` as label_size; `ambiguous` = a roll is loaded
            that the configured label type does not match, and the app must not
            pick between the candidates. Surface it the way the manual path
            does and let the user choose. A missing label is a question; the
            wrong label is a bad print that looks deliberate.
          enum: [none, switch, ambiguous]
          example: none
        from:
          type: string
          nullable: true
          description: The configured label size, i.e. what a switch moves away from.
          example: "12"
        to:
          type: string
          nullable: true
          description: >-
            The label size to store. Null unless action is `switch`.
          example: "62red"
        reason:
          type: string
          description: Why this is the action, in the same words the resolution used.
          example: "Automatic media switching is off, so the label type is left as configured"

    TextPrintRequest:
      type: object
      properties:
        text:
          type: string
          description: Text to print, can include HTML formatting (e.g., <b>Bold</b>, <br> for line break)
          example: "<b>Hello World!</b>\nThis is a test print."
          default: "Hello World!\nThis is a test print."
        settings:
          $ref: '#/components/schemas/PrintSettings'
        confirm_large_batch:
          type: boolean
          description: >-
            Confirm large batches. Required (true) when settings.copies >= 10,
            otherwise the request is rejected with code CONFIRMATION_REQUIRED.
          default: false
        dry_run:
          type: boolean
          description: >-
            Validate only: render the label and check printer reachability, but
            do not print or enqueue. Returns { ok, dry_run, printer_reachable,
            would_print: { label_size, copies, width_px, height_px } }.
          default: false
      required:
        - text
        
    TextQRCodeLabelRequest:
      type: object
      properties:
        qr:
          type: object
          description: QR code settings
          properties:
            data:
              type: string
              description: Data to encode in the QR code
              example: "https://example.com"
              default: "https://example.com"
            position:
              type: string
              description: Position of the QR code
              enum: [left, right]
              example: "right"
              default: "right"
            version:
              type: integer
              description: QR code version (1-40, higher values allow more data)
              example: 1
              default: 1
              minimum: 1
              maximum: 40
            size:
              type: integer
              description: Overall size of the QR code in pixels
              example: 400
              default: 400
              minimum: 100
              maximum: 600
            box_size:
              type: integer
              description: Size of each box in pixels
              example: 10
              default: 10
              minimum: 1
              maximum: 100
            border:
              type: integer
              description: Border size in boxes
              example: 4
              default: 4
              minimum: 0
              maximum: 10
            error_correction:
              type: string
              description: Error correction level (L=7%, M=15%, Q=25%, H=30%)
              enum: [L, M, Q, H]
              example: "M"
              default: "M"
        text:
          type: object
          description: Text settings
          properties:
            content:
              type: string
              description: Text to display on the side (can include line breaks with \n)
              example: "Product: Widget XYZ\nSKU: 12345\nPrice: $19.99"
              default: "Product: Widget XYZ\nSKU: 12345\nPrice: $19.99"
            alignment:
              type: string
              description: Alignment of the text
              enum: [left, center, right]
              example: "left"
              default: "left"
            font_size:
              type: integer
              description: Font size for the text
              example: 30
              default: 30
              minimum: 10
              maximum: 100
        settings:
          $ref: '#/components/schemas/PrintSettings'
        confirm_large_batch:
          type: boolean
          description: >-
            Confirm large batches. Required (true) when settings.copies >= 10,
            otherwise the request is rejected with code CONFIRMATION_REQUIRED.
          default: false
        dry_run:
          type: boolean
          description: >-
            Validate only: render the label and check printer reachability, but
            do not print or enqueue. Returns { ok, dry_run, printer_reachable,
            would_print: { label_size, copies, width_px, height_px } }.
          default: false
      required:
        - qr
        - text

    QRCodePrintRequest:
      type: object
      properties:
        qr:
          type: object
          description: QR code settings
          properties:
            data:
              type: string
              description: Data to encode in the QR code
              example: "https://example.com"
              default: "https://example.com"
            version:
              type: integer
              description: QR code version (1-40, higher values allow more data)
              example: 1
              default: 1
              minimum: 1
              maximum: 40
            size:
              type: integer
              description: Overall size of the QR code in pixels
              example: 400
              default: 400
              minimum: 100
              maximum: 600
            box_size:
              type: integer
              description: Size of each box in pixels
              example: 10
              default: 10
              minimum: 1
              maximum: 100
            border:
              type: integer
              description: Border size in boxes
              example: 4
              default: 4
              minimum: 0
              maximum: 10
            error_correction:
              type: string
              description: Error correction level (L=7%, M=15%, Q=25%, H=30%)
              enum: [L, M, Q, H]
              example: "M"
              default: "M"
        text:
          type: object
          description: Text settings
          properties:
            content:
              type: string
              description: Text to display with the QR code (if not provided, data will be used)
              example: "Scan me!"
            position:
              type: string
              description: Position of the text relative to the QR code
              enum: [none, top, bottom]
              example: "bottom"
              default: "bottom"
            font_size:
              type: integer
              description: Font size for the text
              example: 30
              default: 30
              minimum: 10
              maximum: 100
            alignment:
              type: string
              description: Text alignment
              enum: [left, center, right]
              example: "center"
              default: "center"
        settings:
          $ref: '#/components/schemas/PrintSettings'
        confirm_large_batch:
          type: boolean
          description: >-
            Confirm large batches. Required (true) when settings.copies >= 10,
            otherwise the request is rejected with code CONFIRMATION_REQUIRED.
          default: false
        dry_run:
          type: boolean
          description: >-
            Validate only: render the label and check printer reachability, but
            do not print or enqueue. Returns { ok, dry_run, printer_reachable,
            would_print: { label_size, copies, width_px, height_px } }.
          default: false
      required:
        - qr

    PrintSettings:
      type: object
      description: >-
        Per-request print settings. All fields are optional: any field omitted
        (or the whole settings object) is filled from the app's saved
        configuration, so the common case "print on the configured printer"
        needs no settings at all. Fields present in the request override the
        saved defaults.
      properties:
        printer_uri:
          type: string
          description: URI for connecting to the printer (e.g., tcp://192.168.1.100)
          example: "tcp://192.168.1.100"
          default: "tcp://192.168.1.100"
        printer_model:
          type: string
          description: Model of the Brother QL printer
          example: "QL-800"
          default: "QL-800"
          enum: ["QL-500", "QL-550", "QL-560", "QL-570", "QL-580N", "QL-600", "QL-650TD", "QL-700", "QL-710W", "QL-720NW", "QL-800", "QL-810W", "QL-820NWB", "QL-1050", "QL-1060N", "QL-1100", "QL-1110NWB", "QL-1115NWB"]
        label_size:
          type: string
          description: Size of the label
          example: "62"
          default: "62"
          enum: ["12", "12+17", "18", "29", "38", "50", "54", "62", "62red", "102", "103", "104", "17x54", "17x87", "23x23", "29x42", "29x90", "39x90", "39x48", "52x29", "54x29", "60x86", "62x29", "62x100", "102x51", "102x152", "103x164", "d12", "d24", "d58"]
        text_wrap:
          type: boolean
          description: >
            Wrap text at word boundaries to the label width instead of letting
            it run past the edge. On by default.
          default: true
        auto_fit:
          type: boolean
          description: >
            Shrink the font until the text fits the medium. On a die-cut label
            that means fitting its fixed height; on continuous tape, which grows
            instead, it means shrinking until no single word has to be broken
            mid-word. Only applies while text_wrap is on.
          default: true
        text_markup:
          type: boolean
          description: >
            Honour `**bold**` and `*italic*` in the text instead of printing the
            asterisks. Off by default, and the default matters: labels are
            normally set in DejaVu Sans Bold, which is the more legible weight
            on a thermal printer but leaves nothing heavier for bold to be. With
            this on the base drops to the regular weight, so every label set
            this way looks lighter than the same label set without it. Applies
            to the text label endpoints; other layouts print the markers as
            typed.
          default: false
        font_size:
          type: integer
          description: >
            Point size the text is rendered at, overriding the saved default for
            this request. With auto_fit on this is the starting size: the
            renderer may shrink the text from here to make it fit the medium.
          minimum: 10
          maximum: 100
          default: 50
        alignment:
          type: string
          description: >
            Placement of the text lines along the direction the text reads, the
            horizontal alignment on an upright label, overriding the saved
            default for this request. vertical_alignment places the block on the
            other axis.
          enum: ["left", "center", "right"]
          default: "left"
        vertical_alignment:
          type: string
          description: >
            Position of the text block along the axis perpendicular to the
            direction the text reads — the counterpart to alignment, which
            places the lines horizontally. On die-cut labels, rectangular and
            round alike, it moves the block within the label's fixed height. On
            continuous media it applies only with orientation "lengthwise",
            where it moves the block across the tape width; with the default
            orientation "across" the label grows in length to fit the text
            exactly, so there is no spare space to move within and the setting
            has no effect. "middle" keeps the centred placement.
          enum: ["top", "middle", "bottom"]
          default: "middle"
        orientation:
          type: string
          description: >
            Direction the text runs on the tape. "across" is the default: the
            text runs across the tape width and the label grows in length as
            lines are added. "lengthwise" runs the text along the tape instead,
            so the roll's printable width becomes the line height and the label
            grows with the message — a long message prints as one continuous
            strip rather than being wrapped into a narrow column. Lengthwise
            only applies to continuous ("endless") media, where the length is
            unbounded; die-cut labels have a fixed size in both directions, so
            the setting is ignored there and rendering falls back to "across".
            The text reads bottom-to-top when the strip is held vertically;
            combine with rotate: 180 for the opposite reading direction.
          enum: ["across", "lengthwise"]
          default: "across"
        rotate:
          type: integer
          description: Rotation angle in degrees
          example: 0
          default: 0
          enum: [0, 90, 180, 270]
        threshold:
          type: number
          format: float
          description: Threshold value for image processing (0-100)
          example: 70.0
          default: 70.0
          minimum: 0
          maximum: 100
        dither:
          type: boolean
          description: Enable dithering
          example: false
          default: false
        compress:
          type: boolean
          description: Enable compression
          example: false
          default: false
        red:
          type: boolean
          description: Use red ink (for compatible printers)
          example: false
          default: false
        copies:
          type: integer
          description: Number of identical labels to print
          example: 1
          default: 1
          minimum: 1
          maximum: 100
        cut_mode:
          type: string
          description: When to cut - after each label, only at the end of the run, or never
          example: "each"
          default: "each"
          enum: ["each", "end", "none"]
        dpi_600:
          type: boolean
          description: Print at 600 dpi (higher density) where supported
          example: false
          default: false
        hq:
          type: boolean
          description: High quality printing
          example: true
          default: true
        calibration:
          allOf:
            - $ref: '#/components/schemas/CalibrationMap'
          description: >-
            Per-label print offsets applied on the way to the printer. Normally
            omitted: the map is inherited from the saved settings, where the
            calibration UI stores it. Send it here only to print one job with a
            different offset without changing the saved configuration.
        bleed_mm:
          allOf:
            - $ref: '#/components/schemas/BleedMap'
          description: >-
            Per-label bleed, in millimetres per side, across the tape. Normally
            omitted: the map is inherited from the saved settings. Send it here
            to print or preview one job with a different bleed — note that it
            changes the width of the label being rendered, so a preview
            requested with it will come back wider, which is the intended
            behaviour.
      # No required fields: a request may omit settings (or individual fields)
      # and the app fills them from its saved configuration (request overrides).

    Settings:
      type: object
      properties:
        printer_uri:
          type: string
          description: Default printer URI (e.g., tcp://192.168.1.100)
          example: "tcp://192.168.1.100"
          default: "tcp://192.168.1.100"
        printer_model:
          type: string
          description: Default printer model
          example: "QL-800"
          default: "QL-800"
          enum: ["QL-500", "QL-550", "QL-560", "QL-570", "QL-580N", "QL-600", "QL-650TD", "QL-700", "QL-710W", "QL-720NW", "QL-800", "QL-810W", "QL-820NWB", "QL-1050", "QL-1060N", "QL-1100", "QL-1110NWB", "QL-1115NWB"]
        label_size:
          type: string
          description: Default label size
          example: "62"
          default: "62"
          enum: ["12", "12+17", "18", "29", "38", "50", "54", "62", "62red", "102", "103", "104", "17x54", "17x87", "23x23", "29x42", "29x90", "39x90", "39x48", "52x29", "54x29", "60x86", "62x29", "62x100", "102x51", "102x152", "103x164", "d12", "d24", "d58"]
        font_size:
          type: integer
          description: Default font size
          example: 50
          default: 50
          minimum: 10
          maximum: 100
        alignment:
          type: string
          description: Default text alignment
          enum: [left, center, right]
          example: "left"
          default: "left"
        vertical_alignment:
          type: string
          description: >-
            Default position of the text block along the axis perpendicular to
            the direction the text reads — the counterpart to alignment, which
            places the lines horizontally. On die-cut labels, rectangular and
            round alike, it moves the block within the label's fixed height. On
            continuous media it applies only with orientation "lengthwise",
            where it moves the block across the tape width; with the default
            orientation "across" the label grows in length to fit the text
            exactly, so there is no spare space to move within and the setting
            has no effect.
          enum: ["top", "middle", "bottom"]
          example: "middle"
          default: "middle"
        orientation:
          type: string
          description: >-
            Default direction the text runs on the tape. "across" runs the text
            across the tape width, so the label grows in length as lines are
            added; "lengthwise" runs it along the tape, so the roll's printable
            width becomes the line height and a long message prints as one
            continuous strip. Lengthwise only applies to continuous ("endless")
            media; die-cut labels have a fixed size in both directions and fall
            back to "across".
          enum: ["across", "lengthwise"]
          example: "across"
          default: "across"
        rotate:
          type: integer
          description: Default rotation angle
          example: 0
          default: 0
          enum: [0, 90, 180, 270]
        threshold:
          type: number
          format: float
          description: Default threshold value (0-100)
          example: 70.0
          default: 70.0
          minimum: 0
          maximum: 100
        dither:
          type: boolean
          description: Default dithering setting
          example: false
          default: false
        compress:
          type: boolean
          description: Default compression setting
          example: false
          default: false
        red:
          type: boolean
          description: Default red ink setting
          example: false
          default: false
        copies:
          type: integer
          description: Default number of identical labels to print
          example: 1
          default: 1
          minimum: 1
          maximum: 100
        cut_mode:
          type: string
          description: Default cut behaviour (each label, end of run, or never)
          example: "each"
          default: "each"
          enum: ["each", "end", "none"]
        dpi_600:
          type: boolean
          description: Default 600 dpi setting
          example: false
          default: false
        hq:
          type: boolean
          description: Default high quality setting
          example: true
          default: true
        text_markup:
          type: boolean
          description: >
            Honour `**bold**` and `*italic*` in text labels instead of printing
            the asterisks. Off by default: with it on the base weight drops from
            bold to regular so that bold has something to be heavier than, which
            makes every label set this way look lighter.
          example: false
        keep_alive_enabled:
          type: boolean
          description: Whether keep alive is enabled
          example: false
          default: false
        keep_alive_interval:
          type: integer
          description: Interval between keep alive pings in seconds
          example: 60
          default: 60
          minimum: 10
          maximum: 3600
        keep_alive_mode:
          type: string
          description: >-
            Keep-alive scheduling mode. "forever" keeps the printer awake
            continuously; "timed" only sends pings for keep_alive_duration_seconds
            after the most recent print, then pauses until the next print.
          enum: [forever, timed]
          example: forever
          default: forever
        keep_alive_duration_seconds:
          type: integer
          description: >-
            When keep_alive_mode is "timed", how long (in seconds) to keep the
            printer awake after each print. 0 disables the timed window.
          example: 7200
          default: 7200
          minimum: 0
        ipp_port:
          type: integer
          description: >-
            IPP port used for network printer status and keep-alive checks.
            Defaults to the IANA-standard 631, which is the same on virtually
            all Brother network printers; only change for non-standard setups.
          example: 631
          default: 631
          minimum: 1
          maximum: 65535
        calibration:
          allOf:
            - $ref: '#/components/schemas/CalibrationMap'
          description: >-
            Per-label print corrections, keyed by label identifier: offsets
            in millimetres and an optional size multiplier. This is where the
            calibration UI stores what /calibration/test-print was used to
            measure. Absent or empty means no correction anywhere, which is how
            every existing installation behaves.
        bleed_mm:
          allOf:
            - $ref: '#/components/schemas/BleedMap'
          description: >-
            Per-label bleed, keyed by label identifier, in millimetres per side,
            **across the tape only**. How far outside the published printable
            width a design may run — up to the punched edge of the label. Absent
            or empty means the app prints the area it always has. Read the
            BleedMap description before setting it: it prints into an area the
            manufacturer declares non-printable, both the die-cut tolerance and
            the ink that lands on the liner are visible on the finished roll,
            and on round media it changes the printable area from a circle to an
            ellipse.
        media_auto_switch:
          type: boolean
          description: >-
            Follow the printer: when it reports a roll that label_size is not
            consistent with, adopt the detected one.


            **Off by default, and it has to be chosen.** Every other setting here
            changes what happens when you ask for something. This one changes a
            stored setting — label_size, which decides how every label is
            rendered — without you acting at all, so it is not something to
            inherit from a default.


            It never switches away from a label type that already matches what is
            loaded: 62red stays 62red on a 62 mm roll, because 62red is one of
            the things that roll can be. And where the medium is ambiguous and
            neither the memory nor the owned-media list nor the documented
            default resolves it, it switches nothing and reports the ambiguity —
            see MediaAutoSwitch.
          example: false
          default: false
        owned_media:
          type: array
          description: >-
            The media you actually own, as label identifiers. Used to narrow an
            ambiguous detection: when the printer reports a 62 mm roll and only
            one of 62/62red is a tape you have, the other one is not in the
            building.


            A hint, never a filter. A medium the printer reports is read,
            identified and reported whether or not it appears here — this list
            decides what the app may choose between when the device is genuinely
            ambiguous, and nothing else. Unknown identifiers are rejected by
            name: an entry here helps pick a label size on your behalf, so a
            typo would sit in the list looking like a claim and narrow nothing.
          items:
            type: string
          example: ["62red", "d24"]
          default: []
        media_memory:
          allOf:
            - $ref: '#/components/schemas/MediaMemoryMap'
          description: >-
            The label type last settled on for each medium. This is what makes
            automatic switching defensible on the three media a printer cannot
            pin down: loading a 62 mm roll stops being a guess between 62 and
            62red and becomes a recollection of what was in use last time that
            roll was loaded.


            Maintained by the app while media_auto_switch is on — an entry is
            recorded when a settings write moves label_size to something the
            currently loaded medium could actually be, which is the point at
            which a choice has been settled rather than merely written. That
            recording continues even for a medium that has a media_preference:
            the two answer different questions — what happened, and what was
            meant — and clearing a preference should fall back to the user's
            most recent real choice rather than to whatever predated it.
        media_preference:
          allOf:
            - $ref: '#/components/schemas/MediaPreferenceMap'
          description: >-
            Which variant of a medium you mean when both are possible: "for
            62 mm rolls, the red one". Consulted **first**, ahead of
            media_memory, owned_media and the plain-variant default.


            It exists because ownership was meant to settle these three media
            and mostly cannot. 12/12+17 and 103/104 are one physical roll under
            two identifiers, so nobody can own one without the other; and
            62/62red is settled by ownership only for someone who owns the red
            roll and no plain one. Own a black roll and a black/red roll — the
            ordinary case, on the one medium where a wrong guess yields a
            finished bad label rather than an error — and ownership narrows
            nothing.


            Empty by default: an installation that never sets one resolves
            exactly as it did before.
        relay_webhook_enabled:
          type: boolean
          description: >-
            Switch the printer's mains supply through a relay driven over a
            webhook, so it draws nothing between print runs.


            When a print job arrives and the printer does not answer, a
            "turn_on" webhook is fired and **the job waits in the queue** while
            the printer boots, rather than failing. Optionally a "turn_off"
            webhook is sent once everything has wound down.


            Off by default. While it is off no outbound request is ever made,
            the keep-alive timing is exactly what it has always been, and every
            other relay_* setting is inert.
          example: false
          default: false
        relay_webhook_turn_on_url:
          type: string
          description: >-
            URL POSTed to switch the printer on. Required once
            relay_webhook_enabled is true.


            The body is JSON — `{"action": "turn_on", "source":
            "brother_ql_app", "printer_uri": "tcp://192.168.1.100",
            "printer_model": "QL-800", "timestamp": "<ISO-8601 UTC>"}` — and
            "action" is the only field a relay flow needs to branch on. The rest
            is context, so one flow serving two printers can tell which asked.


            http:// and https:// only. LAN and private addresses are allowed,
            because that is where a relay lives; link-local, loopback and cloud
            metadata endpoints are refused.


            If the endpoint needs a credential, set the
            RELAY_WEBHOOK_AUTHORIZATION environment variable and its value is
            sent verbatim as the Authorization header. It is deliberately not a
            setting: settings are returned in full by GET /settings, so a secret
            stored here would be handed to every client that can read the
            configuration.
          example: "http://192.168.1.42/relay/0?turn=on"
          default: ""
        relay_webhook_turn_off_url:
          type: string
          description: >-
            URL POSTed to cut power. Optional — empty means "use
            relay_webhook_turn_on_url", which is right for a relay that switches
            on the body it is sent. A separate URL exists because many relays
            switch on the address instead (…/relay/0?turn=on versus
            …/relay/0?turn=off) and never read the body. The body is the same
            shape as for turn_on, with "action": "turn_off".
          example: "http://192.168.1.42/relay/0?turn=off"
          default: ""
        relay_webhook_turn_off_enabled:
          type: boolean
          description: >-
            Whether to send the "turn_off" webhook at all. Opt-in separately
            from relay_webhook_enabled: cutting mains power is the half of this
            feature that can go wrong, so switching the feature on does not
            switch this on with it.


            Requires keep-alive enabled in "timed" mode with a non-zero
            keep_alive_duration_seconds. The turn-off moment is measured from
            the end of that window; without an expiry there is no origin to
            measure from, and the combination is rejected.


            ⚠️ Read the warning on printer_auto_power_off_minutes before
            enabling this. Sending "turn_off" is the only thing here that can
            physically damage the printer.


            Never fires while a job is queued or printing — pending work resets
            the clock, whatever the rest of the configuration says. The
            scheduled moment is persisted, so a restart mid-window does not
            strand the relay in the on state.
          example: false
          default: false
        relay_webhook_turn_off_delay_minutes:
          type: integer
          description: >-
            How long after the configured window closes the "turn_off" webhook
            goes out. This is the safety margin that lets the printer's own
            auto-power-off complete before the mains are cut.
          example: 5
          default: 5
          minimum: 0
          maximum: 60
        printer_auto_power_off_minutes:
          type: integer
          description: >-
            The printer's own built-in auto-power-off interval, in minutes, as
            set on the device. Only the six values the device's menu offers are
            accepted; a free field could only ever hold a number the printer
            cannot be set to.


            While relay power control is on, this is subtracted from
            keep_alive_duration_seconds so the printer sleeps at exactly the
            moment configured rather than that moment plus its own timer. With a
            4 h window and a 10 min device timer: keep-alive stops at 3:50, the
            printer switches itself off at 4:00, and "turn_off" goes out at 4:05.


            While relay power control is off, nothing is subtracted and the
            timing is what it has always been: the heartbeat runs the full 4 h
            and the device's own timer then adds its interval on top, so the
            printer sleeps at 4:10. The status endpoint reports which of the two
            applies in hardware_offset_applied.


            A duration equal to this interval is valid and intended — the
            keep-alive heartbeat then does nothing and the hardware carries the
            whole window. A duration shorter than it is rejected: the window
            would have to end before it began.


            ⚠️ **This app cannot read or change the printer's built-in
            auto-power-off time.** The value configured here is a statement
            about the device rather than a setting on it, and nothing verifies
            that the two agree. Set it to exactly what the printer's own menu
            shows. **If the interval on the device is longer than the value
            configured here, the relay will cut mains power while the printer is
            still running, which can interrupt a print mid-feed and can damage
            the printer.**
          example: 10
          default: 10
          enum: [10, 20, 30, 40, 50, 60]
      required:
        - printer_uri
        - printer_model
        - label_size

    CalibrationOffset:
      type: object
      description: >-
        A print offset in millimetres. x_mm positive moves the printed content
        right on the tape; y_mm positive moves it down (later in the feed
        direction). Both default to 0, which prints exactly as an uncalibrated
        app does. The two axes are corrected differently, because the printer
        offers a lever on one and not on the other: sideways, the whole raster
        is placed further along the print head, so no content is ever cut off
        and the only limit is how much head there is beside the loaded media --
        a request beyond that is clamped to what the printer can reach and
        logged with the amount actually applied. Along the feed the raster
        starts where the feed starts, so the content is moved inside the
        label's own canvas and a large offset can push content off the edge,
        which is logged as well.
      properties:
        x_mm:
          type: number
          format: float
          description: >-
            Sideways offset in millimetres; positive moves right. Clamped at
            print time to the travel the print head allows beside the loaded
            media; /calibration/test-print reports both what was requested and
            what will be applied.
          example: -0.5
          default: 0
          minimum: -10
          maximum: 10
        y_mm:
          type: number
          format: float
          description: >-
            Offset along the feed in millimetres; positive moves down (later in
            the feed). Content pushed past the edge of the label is clipped.
          example: 1.0
          default: 0
          minimum: -10
          maximum: 10
        scale:
          type: number
          format: float
          description: >-
            Size correction: a multiplier on the printed content, applied about
            the centre of the label. 0.98 prints it 2 % smaller. It corrects a
            printer that lays ink down slightly larger or smaller than it was
            asked to, which is why the range is deliberately narrow: it is
            not a zoom. Like the offsets it applies to prints only and never to
            a preview, so using it to resize a design would leave the preview
            showing something the paper does not. The canvas may not grow, so
            scaling up crops at the rim and logs the amount.
          example: 0.98
          default: 1.0
          minimum: 0.95
          maximum: 1.05
      additionalProperties: false

    CalibrationMap:
      type: object
      description: >-
        Per-label print offsets, keyed by label identifier (e.g. "d24",
        "62x29"). Offsets are keyed by media rather than by printer because
        what they correct, die-cut registration tolerance and the raster
        offset of the loaded roll, is a property of the media. A missing key
        and an entry of zeros mean the same thing: print as before. Applied on
        the print path only; the preview endpoints deliberately show the label
        as designed, since calibration exists to make the paper match them.
      additionalProperties:
        $ref: '#/components/schemas/CalibrationOffset'
      example:
        d24:
          x_mm: -0.5
          y_mm: 1.0

    MediaMemoryMap:
      type: object
      description: >-
        The label type last settled on for each medium, keyed by the medium's
        **plain variant** — "62" for the 62 mm continuous roll, "12" for the
        12 mm one, "103" for the 103/104 pair. Everything else is a variant of
        one of those and is stored as the value, never as the key.


        The key names the medium rather than the detection, and that is what
        makes it survive: it is not the candidate list (derived from the media
        catalogue, so a new variant or a reordered table would orphan every
        entry), not the list's order, not a label from the UI (a wording or
        translation change away from moving), and not the reported millimetres
        (the device quantises them — 103.6 mm arrives as 104). "62" means the
        62 mm roll however many variants of it the catalogue grows.


        The value has to be one of the identifiers that medium can be addressed
        by, and an entry that breaks that — `{"62": "d24"}` — is rejected by
        name. This is the one setting that can change label_size without the
        user acting, so an entry that would switch a continuous roll to a
        die-cut label size is caught at the door rather than at the printer.
      additionalProperties:
        type: string
      example:
        "62": "62red"

    MediaPreferenceMap:
      type: object
      description: >-
        The variant that wins for each medium, keyed exactly as MediaMemoryMap
        is — on the medium's **plain variant**, "62" for the 62 mm continuous
        roll, "12" for the 12 mm one, "103" for the 103/104 pair — and for the
        same reasons: the key has to name the medium rather than the detection
        if it is to survive a catalogue that grows a variant, reorders a table
        or quantises a measurement.


        `{"62": "62red"}` reads "when a 62 mm roll is loaded, I mean the red
        one", and it is consulted before the memory. The memory is inferred from
        what happened last; this is a statement of intent, and one contrary pick
        on some Tuesday should not overwrite it.


        The value must be one of the identifiers that medium can be addressed
        by. `{"62": "d24"}` is rejected by name, as is a key that is itself a
        variant — `{"62red": "62red"}` would file a preference under a name the
        resolution never looks up. Of the settings that can move label_size
        without you acting this is the one with the most authority, so both
        halves are checked at the door.


        A preference for a medium that has only one variant — `{"d24": "d24"}` —
        is accepted and does nothing: detection already resolves such a medium
        on its own, so the map is never consulted for it. It is not rejected
        because it states something true, and because a medium with one variant
        today may have two after a brother_ql upgrade.
      additionalProperties:
        type: string
      example:
        "62": "62red"

    BleedMap:
      type: object
      description: >-
        Per-label bleed, keyed by label identifier (e.g. "d24", "62x29"), in
        millimetres **per side**. Absent or 0 means the app prints the area it
        always has, which is what every existing installation does.


        Every label is offered smaller than it is. brother_ql publishes 20 mm of
        a 24 mm round die cut as printable, so 2.03 mm of paper all round is
        unreachable by any design — the ring of bare paper you can measure on a
        finished label. Bleed hands that strip back: the raster is rendered
        wider and placed so the label stays exactly where it was, letting
        content run out to the punched edge.


        **Bleed widens the label; it never lengthens it.** That is a hardware
        constraint, not a simplification. Each raster line the printer receives
        is one step of the paper feed, so the number of lines in a job is how far
        the media advances while the label prints. A version of this feature that
        also extended the raster along the feed made every d24 page advance 4 mm
        too far: the cutter walked off the gap between labels until the roll lost
        registration and had to be re-seated. Nothing in the raster language can
        give those steps back — the one feed command carries the media's own
        margin and cannot be negative — so the feed axis is simply not a resource
        bleed can spend, however much unused paper is sitting there. On a 62x29
        label that is 2.96 mm a side along the feed against 1.52 mm across it,
        and only the 1.52 mm is available.


        A consequence worth knowing for round media: a bled round label is no
        longer square (a bled d24 is 284 × 236 dots) and its printable area is
        therefore an **ellipse** rather than a circle — full width at the middle,
        tapering top and bottom. Layout follows that ellipse, so the extra width
        is really usable and not quietly given back. It also means `rotate` 90 or
        270 no longer works on a bled round label, exactly as it has never worked
        on rectangular die-cut labels: a quarter turn does not fit a canvas that
        is a fixed size. Such a request is refused with an explanation rather
        than a dimension mismatch. `rotate` 0 and 180 are unaffected.


        Whatever is asked for is clamped to what the loaded medium and the
        printer can actually give — half the difference between the label's
        total and printable dots, and never wider than the print head — so
        setting 5 mm on a d24 gets 2.03 mm, and says so in the log and in the
        `bleed` block of /calibration/test-print. Values above 5 mm are rejected
        outright as a wrong unit rather than a request.


        **What you are opting into.** This prints into the area Brother declares
        non-printable, and there are two consequences you should expect to see
        on the paper:


        * **Die-cut registration varies from label to label.** The punch and the
          feed each have a tolerance of a few tenths of a millimetre, so content
          taken right out to the edge will show that variation — a design that
          touches the rim on one label may stop just short of it, or run just
          past it, on the next. Content that matters (text, a code, a border you
          want to look deliberate) is better kept inside the published area;
          bleed is for backgrounds and colour that are meant to run off.

        * **Ink lands on the liner.** Anything that overshoots the die cut is
          printed on the backing paper between labels rather than on the label
          you peel off. It is not lost from the roll, but it is on the liner,
          and on a black-heavy design it is visible there.


        Both apply across the tape, which is the only direction bleed acts in.
        The label's position is otherwise untouched: the raster is widened and
        the paste position moved by exactly half the growth, so the centre of the
        label lands on the same dot of the print head as it did unbled, and the
        job is the same number of raster lines long.


        Bleed is a **separate setting from `calibration`**, and deliberately so.
        Calibration corrects a printer that puts ink in the wrong place, so it
        applies to prints and never to previews — the preview is the target the
        correction aims at. Bleed changes how large the label you are designing
        is, so it **does** show in every preview, exactly like the label size.
      additionalProperties:
        type: number
        format: float
        description: Bleed for this medium, in millimetres per side.
        minimum: 0
        maximum: 5
      example:
        d24: 2.0

    CalibrationSweep:
      type: object
      description: >-
        Opt-in one-pass calibration: print several numbered targets whose
        offsets step around the value currently in force, then keep the one that
        looks centred. Each step costs a physical label.
      properties:
        axis:
          type: string
          description: >-
            Axis to step. One axis at a time: a diagonal sweep cannot tell which
            of the two errors a given label is showing.
          enum: [x, y]
          example: x
          default: x
        count:
          type: integer
          description: Number of targets to print, one label each.
          example: 5
          default: 5
          minimum: 2
          maximum: 9
        step_mm:
          type: number
          format: float
          description: Difference in millimetres between one target and the next.
          example: 0.5
          default: 0.5
          minimum: 0.1
          maximum: 5.0
      additionalProperties: false

    CalibrationTestPrintRequest:
      type: object
      properties:
        label_size:
          type: string
          description: >-
            Medium to calibrate. Overrides settings.label_size; when both are
            omitted the saved default label size is used.
          example: "d24"
        offset:
          $ref: '#/components/schemas/CalibrationOffset'
        sweep:
          $ref: '#/components/schemas/CalibrationSweep'
        settings:
          $ref: '#/components/schemas/PrintSettings'
        dry_run:
          type: boolean
          description: >-
            Validate only: render the target and check printer reachability, but
            do not print or enqueue. Returns { ok, dry_run, printer_reachable,
            would_print: { label_size, copies, labels, width_px, height_px,
            offsets_mm, requested_offsets_mm, clamped, sideways_travel_mm,
            scale } }: the same offset/clamp/travel report a real run gives,
            so a client can check what the printer would do without spending a
            label on finding out.
          default: false

    CalibrationPreviewRequest:
      type: object
      properties:
        label_size:
          type: string
          description: >-
            Medium to render the target for. Overrides settings.label_size.
          example: "d24"
        offset:
          $ref: '#/components/schemas/CalibrationOffset'
        settings:
          $ref: '#/components/schemas/PrintSettings'

    CalibrationPrintResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the calibration run was queued
          example: true
        job_id:
          type: string
          description: Identifier of the queued print job
          example: "6f1c1a1e2b7d4f3c"
        message:
          type: string
          example: "Print job queued"
        label_size:
          type: string
          description: The medium the target is printed on
          example: "d24"
        offsets_mm:
          type: array
          description: >-
            The offsets that will actually be printed, in print order. A single
            entry for a normal test print, one per step for a sweep. Each
            target prints its own number and the offset it was really printed
            with on itself. Where the print head has less travel beside the
            loaded media than was requested, this is the clamped value, so it
            always describes what the paper will show.
          items:
            $ref: '#/components/schemas/CalibrationOffset'
        requested_offsets_mm:
          type: array
          description: >-
            The offsets as requested, in the same order. Equal to offsets_mm
            unless something was clamped.
          items:
            $ref: '#/components/schemas/CalibrationOffset'
        clamped:
          type: boolean
          description: >-
            Whether any offset had to be reduced to the travel the printer has.
            When true, offsets_mm differs from requested_offsets_mm and the
            client should say so rather than let the user believe the full
            correction was applied.
          example: false
        sideways_travel_mm:
          type: object
          nullable: true
          description: >-
            How far x_mm can go on this printer with this medium loaded,
            measured from the uncalibrated position. Null when it cannot be
            worked out (an unknown printer model or label identifier, or media
            as wide as the print head), because not knowing the limit is no
            reason to invent one. Travel is usually asymmetric: a 24 mm round
            label on a QL-820NWB sits close to one end of the head, with about
            37 mm of travel one way and 3.5 mm the other.
          properties:
            min:
              type: number
              format: float
              description: Most negative (leftward) x_mm this medium allows.
              example: -37.42
            max:
              type: number
              format: float
              description: Most positive (rightward) x_mm this medium allows.
              example: 3.56
        scale:
          type: number
          format: float
          description: The size correction in force for this medium.
          example: 1.0
        bleed:
          type: object
          description: >-
            The bleed in force for this medium, and — more usefully — how much
            it could have. Reported here because this is the one endpoint that
            already answers "what can this medium on this printer actually do?",
            and a bleed control needs the per-medium ceiling from somewhere:
            2.03 mm on d24, 2.96 mm on d58, and only 1.02 mm on 62 mm tape on a
            QL-800-class printer, where the print head runs out before the paper
            does.
          properties:
            requested_mm:
              type: number
              format: float
              description: The bleed configured for this medium, per side.
              example: 2.0
            applied_mm:
              type: number
              format: float
              description: >-
                What will really be used across the tape, after clamping.
              example: 2.03
            limit_mm:
              type: number
              format: float
              nullable: true
              description: >-
                The most this medium can bleed across the tape on this printer.
                Null for a label identifier the media catalogue does not know,
                because not knowing the margin is no reason to invent one. There
                is no feed-direction counterpart, because none is ever available
                — see BleedMap.
              example: 2.03
            clamped:
              type: boolean
              description: >-
                Whether more bleed was asked for than the medium or the print
                head can give.
              example: false

    PrintResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the print operation was successful
          example: true
        job_id:
          type: string
          description: Unique identifier for the print job
          example: "job_12345"
        message:
          type: string
          description: Success message
          example: "Print job submitted successfully"

    PreviewResponse:
      type: object
      description: >-
        Default JSON wrapper for a rendered preview. To receive the raw PNG
        bytes instead (no JSON parsing / base64 decoding), send the request with
        `Accept: image/png`; the binary response then carries the pixel size in
        the `X-Label-Width-Px` and `X-Label-Height-Px` headers.
      properties:
        image:
          type: string
          description: >-
            The rendered label, exactly as it would be printed (1-bit
            black/white), encoded as a PNG data URL.
          example: "data:image/png;base64,iVBORw0KGgo..."
      required:
        - image

    PdfPreview:
      type: object
      properties:
        total_pages:
          type: integer
          description: Total number of pages in the PDF document
          example: 8
        truncated:
          type: boolean
          description: >-
            Whether the page selection was capped (only the first N pages were
            rendered)
          example: false
        rendered_pages:
          type: array
          description: The 1-based page numbers that were actually rendered
          items:
            type: integer
          example: [1, 2, 3]
        previews:
          type: array
          description: One thumbnail per rendered page
          items:
            type: object
            properties:
              page:
                type: integer
                description: 1-based page number
                example: 1
              image:
                type: string
                description: PNG thumbnail encoded as a data URL
                example: "data:image/png;base64,iVBORw0KGgo..."

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
          example: true
        message:
          type: string
          description: Success message
          example: "Operation completed successfully"

    Error:
      type: object
      properties:
        code:
          type: string
          description: >-
            Stable machine-readable token, safe to switch on. Every code is
            SCREAMING_SNAKE_CASE and declared by the app rather than derived
            from anything internal. The ones a client can encounter:
            `VALIDATION_ERROR` (a rejected input, including the ones the
            specification itself rejects), `CONFIRMATION_REQUIRED` (a large
            batch needs `confirm_large_batch`), `UNAUTHORIZED`,
            `RESOURCE_NOT_FOUND`, `METHOD_NOT_ALLOWED`, `PAYLOAD_TOO_LARGE`,
            `PRINTER_ERROR` (the printer refused; `message` carries its own
            words), `RELAY_WEBHOOK_ERROR` (the relay could not be reached, so
            the printer cannot be powered), `IMAGE_PROCESSING_ERROR`,
            `CONFIGURATION_ERROR` and `INTERNAL_SERVER_ERROR`.
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: Error message
          example: "The specified printer could not be found"
        details:
          type: object
          description: Additional error details
          additionalProperties: true

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "VALIDATION_ERROR"
            message: "'printer_uri' is a required property"
            details:
              field: "printer_uri"

    Unauthorized:
      description: >-
        Missing or invalid API key. Only ever returned when the server was
        started with the API_KEY environment variable set; with it unset the
        API is unauthenticated and this response cannot occur. The UI, the
        Swagger UI, the specification itself and the health endpoints stay
        reachable without a key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "UNAUTHORIZED"
            message: "A valid API key is required for this endpoint"
            details:
              header: "X-API-Key"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "RESOURCE_NOT_FOUND"
            message: "The specified printer could not be found"
            details:
              resource_type: "printer"
              resource_id: "tcp://192.168.1.100"

    InternalServerError:
      description: >-
        Something went wrong on the server side. Two different things arrive
        here: a printer that refused the job, which answers `PRINTER_ERROR`
        with the device's own words in `message` because that is what the
        caller has to act on, and a fault inside the app, which answers
        `INTERNAL_SERVER_ERROR` with a fixed sentence plus `details.error_id` —
        the same short token the log record for that failure carries, so an
        operator can find the complete story without anything about the
        server's insides travelling in the response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "INTERNAL_SERVER_ERROR"
            message: "An internal error occurred"
            details:
              error_id: "e12345"
