name: Release Workflow

on:
  push:
    branches:
      - main
      - dev

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Checkout des Codes
      - name: Checkout code
        uses: actions/checkout@v3

      # Git konfigurieren
      - name: Configure Git
        run: |
          git config --global user.email "ci@github-actions.com"
          git config --global user.name "GitHub Actions CI"

      # Extract the version and release notes from the first changelog section.
      # Supports both final releases (e.g. 4.0.0) and pre-releases with a suffix
      # (e.g. 4.0.0-dev, 4.0.0-rc.1) so the dev branch can publish pre-releases.
      # The dev branch is published as a pre-release (see the Create Release step).
      - name: Extract Version and Release Notes
        id: changelog
        run: |
          if [ ! -f changelog.md ]; then
            echo "ERROR: changelog.md not found!" >&2
            exit 1
          fi

          if [[ "${{ github.ref }}" != "refs/heads/main" && "${{ github.ref }}" != "refs/heads/dev" ]]; then
            echo "ERROR: Unsupported branch ${{ github.ref }}" >&2
            exit 1
          fi

          # Version = first "## [x.y.z]" heading, with an optional pre-release
          # suffix (e.g. -dev, -rc.1). Notes = body of that exact version section
          # (keyed off the resolved version, so a leading "## [Unreleased]" or
          # any other non-version heading is skipped safely).
          VER_RE='[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'
          VERSION=$(grep -m1 -oE "## \[${VER_RE}\]" changelog.md | grep -oE "${VER_RE}")

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not extract a version from changelog.md" >&2
            exit 1
          fi

          NOTES=$(awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' changelog.md)

          echo "Resolved version: $VERSION (pre-release: ${{ github.ref == 'refs/heads/dev' }})"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "NOTES<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # Stable versions belong to main. The dev branch publishes pre-releases
      # only (4.0.0-dev, 4.1.0-rc.1, ...).
      #
      # Without this, bumping the changelog to a final version and pushing it to
      # dev creates the tag on the dev commit as a pre-release. The subsequent
      # merge to main then finds the tag already taken, skips, and the release
      # that should mark main never happens.
      - name: Skip stable versions on dev
        id: check_branch
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" && "${{ env.VERSION }}" != *-* ]]; then
            echo "Version ${{ env.VERSION }} is a stable release and belongs to main. Skipping on dev."
            echo "SKIP=true" >> $GITHUB_ENV
          else
            echo "SKIP=false" >> $GITHUB_ENV
          fi

      # Überprüfen, ob der Tag bereits im Remote existiert
      - name: Check if Tag Exists in Remote
        id: check_remote_tag
        if: env.SKIP == 'false'
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ env.VERSION }}"; then
            echo "Tag ${{ env.VERSION }} already exists in remote."
            echo "EXISTS=true" >> $GITHUB_ENV
          else
            echo "EXISTS=false" >> $GITHUB_ENV
          fi

      # Schritt überspringen, wenn Tag im Remote existiert
      - name: Skip if Tag Exists
        if: env.SKIP == 'false' && env.EXISTS == 'true'
        run: |
          echo "Tag ${{ env.VERSION }} already exists in remote. Skipping release."
          exit 0

      # Neuen Git-Tag erstellen und pushen
      - name: Create and Push Tag
        if: env.SKIP == 'false' && env.EXISTS == 'false'
        run: |
          git tag -a ${{ env.VERSION }} -m "Release ${{ env.VERSION }}"
          git push origin ${{ env.VERSION }}

      # GitHub Release erstellen
      - name: Create GitHub Release
        if: env.SKIP == 'false' && env.EXISTS == 'false'
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          release_name: "Release ${{ env.VERSION }}"
          body: ${{ env.NOTES }}
          draft: false
          prerelease: ${{ github.ref == 'refs/heads/dev' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
