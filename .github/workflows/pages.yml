# Deploy the static demo UI (src/static/) to GitHub Pages.
#
# GitHub Pages serves only static files, so the bundled demo layer in
# js/demo.js detects the *.github.io host and serves all /api/v1 calls from an
# in-memory mock — letting the interface run fully interactive without the
# Python backend.

name: Deploy demo to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/static/**"
      - ".github/workflows/pages.yml"
      # The published API reference is rendered from the specification, so a
      # change to it alone has to redeploy too, or the reference goes stale
      # while the interface beside it is current.
      - "src/api/openapi.yaml"

# Allow the workflow to publish to Pages and mint the deployment id token.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Web analytics for the published demo, added to the artifact and never to
      # the repository.
      #
      # It is deliberately not in src/static: that directory ships inside the
      # Docker image and is served by everybody who runs this app on their own
      # network, and none of those installations should report anything to
      # anyone. Keeping the snippet out of the tree also keeps the endpoint and
      # the site id out of every clone and fork.
      #
      # Both values come from repository variables (Settings > Secrets and
      # variables > Actions > Variables):
      #
      #     MATOMO_TRACKER_URL   e.g. //stats.example.net/
      #     MATOMO_SITE_ID       e.g. 16
      #
      # With either one unset -- which is every fork -- the step says so and the
      # demo deploys untouched. The injected page is the only copy that has it.
      - name: Add analytics to the demo artifact
        env:
          MATOMO_TRACKER_URL: ${{ vars.MATOMO_TRACKER_URL }}
          MATOMO_SITE_ID: ${{ vars.MATOMO_SITE_ID }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          url = (os.environ.get("MATOMO_TRACKER_URL") or "").strip()
          site = (os.environ.get("MATOMO_SITE_ID") or "").strip()
          if not url or not site:
              print("No MATOMO_TRACKER_URL/MATOMO_SITE_ID set; deploying the demo without analytics.")
              sys.exit(0)
          if not url.endswith("/"):
              url += "/"
          if not site.isdigit():
              sys.exit(f"MATOMO_SITE_ID must be a number, got {site!r}")

          page = "src/static/index.html"
          with open(page, encoding="utf-8") as handle:
              html = handle.read()
          if "matomo.js" in html:
              sys.exit("index.html already carries a tracker; refusing to add a second one")
          if "</head>" not in html:
              sys.exit("no </head> in index.html; not injecting blind")

          snippet = "\n".join([
              "    <script>",
              "        var _paq = window._paq = window._paq || [];",
              "        _paq.push(['trackPageView']);",
              "        _paq.push(['enableLinkTracking']);",
              "        (function() {",
              f"            var u = \"{url}\";",
              "            _paq.push(['setTrackerUrl', u + 'matomo.php']);",
              f"            _paq.push(['setSiteId', '{site}']);",
              "            var d = document, g = d.createElement('script'), s = d.getElementsByTagName('script')[0];",
              "            g.async = true; g.src = u + 'matomo.js'; s.parentNode.insertBefore(g, s);",
              "        })();",
              "    </script>",
              "",
          ])
          html = html.replace("</head>", snippet + "</head>", 1)
          with open(page, "w", encoding="utf-8") as handle:
              handle.write(html)
          print(f"Analytics added to the artifact: site {site} at {url}")
          PY

      # The API reference, rendered into the artifact.
      #
      # The app serves a Swagger UI at /api/v1/ui/, but that needs the Python
      # backend, and a static host has none. Redoc renders the same
      # specification entirely in the browser, so the published demo can carry
      # the reference beside the interface. It is read-only, which is the right
      # shape here: Swagger UI's "Execute" button would fire requests at a
      # backend that does not exist and answer every one of them with a failure.
      #
      # Built here rather than committed: src/static ships inside the Docker
      # image, and an installation that already has the real Swagger UI has no
      # use for a second copy of the docs.
      - name: Render the API reference for the demo
        run: |
          set -euo pipefail
          mkdir -p src/static/api
          cp src/api/openapi.yaml src/static/api/openapi.yaml
          curl -fsSL --retry 3 \
            -o src/static/api/redoc.standalone.js \
            "https://cdn.redoc.ly/redoc/v2.5.0/bundles/redoc.standalone.js"
          # Redoc's own badge is an <img> pointing back at its CDN, so every
          # visitor to the reference would announce themselves there. The badge
          # stays -- the attribution is earned -- but it is served from beside
          # the page, like every other asset this project ships.
          curl -fsSL --retry 3 \
            -o src/static/api/logo-mini.svg \
            "https://cdn.redoc.ly/redoc/logo-mini.svg"
          sed -i 's|https://cdn\.redoc\.ly/redoc/logo-mini\.svg|logo-mini.svg|' \
            src/static/api/redoc.standalone.js
          if grep -q 'cdn\.redoc\.ly/redoc/logo-mini' src/static/api/redoc.standalone.js; then
            echo "the badge still points at the CDN; the bundle must have changed" >&2
            exit 1
          fi
          cat > src/static/api/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Brother QL Printer App - API reference</title>
          <style>body { margin: 0; }</style>
          </head>
          <body>
          <redoc spec-url="openapi.yaml" hide-download-button></redoc>
          <script src="redoc.standalone.js"></script>
          </body>
          </html>
          HTML
          # Indentation from the heredoc above has to go, or the browser gets a
          # page whose <!doctype> is not at the start.
          sed -i 's/^          //' src/static/api/index.html
          echo "API reference built: $(du -sh src/static/api | cut -f1)"

      - name: Upload static UI artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
