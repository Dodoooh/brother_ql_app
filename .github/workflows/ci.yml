name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  # Run the checks on pull requests too, so a merge into main is not the first
  # time anything is verified. Contributor PRs get the same treatment.
  pull_request:
    branches:
      - main
      - dev

jobs:
  # Run lint, tests and a dependency vulnerability scan before building the
  # image.
  #
  # NOTE on blocking behaviour:
  #   - ruff is intentionally still non-blocking (|| true) because the codebase
  #     is not yet lint-clean. To make it block the build later, simply drop the
  #     `|| true` from that step.
  #   - pytest IS blocking: a failing test must stop the build.
  #   - pip-audit IS blocking (no `|| true`): a known vulnerability in the
  #     pinned/installed requirements must fail the pipeline and stop the build.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The same font family the runtime image installs (see Dockerfile). Every
      # rendering test looks for a real TrueType face and quietly skips itself
      # when the host has none -- which on a bare runner was all of them, so a
      # third of the suite never ran here and two genuine failures went unseen
      # for weeks. `fonts-dejavu-core` is not enough: the markup tests need the
      # oblique faces, which only the full package ships.
      - name: Install DejaVu fonts (the render tests need a real font)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Non-blocking for now (codebase not yet lint-clean) — remove `|| true`
      # to enforce.
      - name: Lint (ruff)
        run: ruff check . || true

      # BLOCKING: a failing test fails the job and, via `needs: test`, stops the
      # image from being built and pushed.
      - name: Run tests (pytest)
        run: pytest -q

      # BLOCKING: audit the pinned requirements. A vulnerability finding fails
      # this step, fails the `test` job, and (via `needs: test`) prevents the
      # Docker image from being built and pushed.
      #
      # The ignored advisories are structural, not oversights:
      #   flask / werkzeug -- connexion 2.14.2 requires werkzeug<2.3, which pins
      #     Flask to 2.2.5. Clearing these means migrating to connexion 3.
      # Everything outside this list is fixable and must keep failing the build.
      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln GHSA-68rp-wp8r-4726 \
            --ignore-vuln PYSEC-2023-221 \
            --ignore-vuln GHSA-2g68-c3qc-8985 \
            --ignore-vuln GHSA-f9vj-2wh5-fj8j \
            --ignore-vuln GHSA-q34m-jh98-gwm2 \
            --ignore-vuln GHSA-hgf8-39gv-g3f2 \
            --ignore-vuln GHSA-87hc-h4r5-73f7 \
            --ignore-vuln GHSA-29vq-49wr-vm6x

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    # Push events only. A pull request has no branch ref to derive a tag from,
    # and its Docker Hub credentials are not available anyway -- pull requests
    # are meant to be verified by the `test` job, not to publish anything.
    if: github.event_name == 'push'

    steps:
      # Checkout des Codes
      - name: Checkout code
        uses: actions/checkout@v3

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Set Docker Tags based on the branch. Alongside the moving tag we publish
      # an immutable one taken from the changelog, so a bug report can name the
      # exact build it came from ("dev" moves with every push).
      - name: Set Docker Tags
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
          fi

          VER_RE='[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'
          VERSION=$(grep -m1 -oE "## \[${VER_RE}\]" changelog.md | grep -oE "${VER_RE}")
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not extract a version from changelog.md" >&2
            exit 1
          fi
          echo "VERSION_TAG=$VERSION" >> $GITHUB_ENV

      # arm64 is emulated on an amd64 runner, which is why these two steps are
      # here at all. Nothing is compiled during the build -- every dependency
      # arrives as a wheel -- so the emulation only has to run pip and a few
      # shell commands.
      - name: Set up QEMU for the arm64 build
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Built for both architectures and published as one multi-arch tag, so
      # `docker pull` picks the right one by itself.
      #
      # arm64 is not a nice-to-have here: this app runs next to the printer, and
      # that machine is usually a Raspberry Pi or a NAS. Until now those had no
      # image at all.
      - name: Build and push the image for amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/brother_ql_app:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/brother_ql_app:${{ env.VERSION_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A tag that exists but serves the wrong architecture is worse than one
      # that is missing, so the manifest is read back rather than assumed.
      - name: Check both architectures are in the published tag
        run: |
          set -euo pipefail
          for tag in "${{ env.IMAGE_TAG }}" "${{ env.VERSION_TAG }}"; do
            image="${{ secrets.DOCKER_USERNAME }}/brother_ql_app:$tag"
            archs=$(docker buildx imagetools inspect "$image" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
            echo "$image -> $archs"
            for want in linux/amd64 linux/arm64; do
              case "$archs" in
                *"$want"*) ;;
                *) echo "missing $want in $image" >&2; exit 1 ;;
              esac
            done
          done
