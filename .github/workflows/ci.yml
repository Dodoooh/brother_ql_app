# One pipeline, one graph on the run page: read the version, check the code,
# build each architecture, assemble the tag, cut the release. Every stage names
# what it waits for, so nothing can happen out of order.
#
# It used to be two workflows. `release.yml` hung off the same `push` event as
# this one and knew nothing about it, so the tag and the GitHub release were
# created while the tests were still running -- measured on 4.0.0-rc.2, the
# release existed four minutes and 47 seconds before the image it names. A
# failing test would have left a release pointing at nothing.

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  # Run the checks on pull requests too, so a merge into main is not the first
  # time anything is verified. Contributor PRs get the same treatment.
  pull_request:
    branches:
      - main
      - dev

# Two pushes in quick succession would otherwise race, and the older one could
# be the last to publish. Pull requests cancel: only the newest matters.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # The version, read once and handed to everyone who needs it.
  #
  # It used to be parsed twice, here and in release.yml, with two copies of the
  # same regex kept in step by hand.
  # --------------------------------------------------------------------------
  version:
    name: Read the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      moving_tag: ${{ steps.read.outputs.moving_tag }}
      prerelease: ${{ steps.read.outputs.prerelease }}
      releasable: ${{ steps.read.outputs.releasable }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read the version from the changelog
        id: read
        run: |
          set -euo pipefail

          # The first "## [x.y.z]" heading, with an optional pre-release suffix
          # (-dev, -rc.1). Anything above it, such as "## [Unreleased]", is
          # skipped because it does not match.
          ver_re='[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'
          version=$(grep -m1 -oE "## \[${ver_re}\]" changelog.md | grep -oE "${ver_re}" || true)
          if [ -z "$version" ]; then
            echo "No version heading found in changelog.md" >&2
            exit 1
          fi

          # The moving tag follows the branch; the version tag never moves.
          case "${GITHUB_REF}" in
            refs/heads/main) moving_tag=latest ;;
            refs/heads/dev)  moving_tag=dev ;;
            *)               moving_tag= ;;
          esac

          # A suffix means a pre-release. Stable versions belong to main: without
          # this, bumping the changelog to a final version and pushing it to dev
          # would put the tag on a dev commit, and the merge to main would then
          # find the tag taken and publish nothing.
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          releasable=true
          if [ "${GITHUB_REF}" = "refs/heads/dev" ] && [ "$prerelease" = "false" ]; then
            releasable=false
          fi

          {
            echo "version=$version"
            echo "moving_tag=$moving_tag"
            echo "prerelease=$prerelease"
            echo "releasable=$releasable"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Version"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| From the changelog | \`$version\` |"
            echo "| Moving tag | \`${moving_tag:-none}\` |"
            echo "| Pre-release | $prerelease |"
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # Lint, tests and a dependency scan. Everything downstream waits for this.
  #
  # What blocks and what does not:
  #   - ruff is deliberately non-blocking (`|| true`): the codebase is not lint
  #     clean yet. Drop the `|| true` to enforce it.
  #   - pytest blocks. A failing test must stop the build.
  #   - pip-audit blocks. A known vulnerability in the pinned requirements must
  #     stop the build.
  # --------------------------------------------------------------------------
  test:
    name: Lint, tests, dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The same font family the runtime image installs (see Dockerfile). Every
      # rendering test looks for a real TrueType face and quietly skips itself
      # when the host has none -- which on a bare runner was all of them, so a
      # third of the suite never ran here and two genuine failures went unseen
      # for weeks. `fonts-dejavu-core` is not enough: the markup tests need the
      # oblique faces, which only the full package ships.
      - name: Install DejaVu fonts (the render tests need a real font)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff, not blocking yet)
        run: ruff check . || true

      - name: Run tests (pytest)
        run: pytest -q

      # No exemptions. There used to be eight, all of them downstream of one
      # thing: connexion 2.14.2 required werkzeug<2.3, which pinned Flask to
      # 2.2.5 and held both there. Connexion 3 removed that pin and the
      # advisories went with it. Anything that appears here now is fixable and
      # must fail the build.
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

  # --------------------------------------------------------------------------
  # One job per architecture, each on a runner of its own kind. No emulation:
  # this repository is public, so GitHub's arm64 runners cost nothing, and the
  # arm64 `pip install` drops from 108 seconds under QEMU to native speed.
  #
  # Neither job tags anything. Each pushes its layers and reports back a digest,
  # and only the next job turns those into a tag -- so a tag can never exist
  # with one architecture missing.
  # --------------------------------------------------------------------------
  image:
    name: Build ${{ matrix.platform }}
    needs: [version, test]
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    # Without this a runner label that is not available queues for GitHub's
    # default six hours instead of saying so. Both builds take minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    env:
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/brother_ql_app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # push-by-digest: the layers go to the registry, no tag is claimed.
      # provenance is off because the attestation manifests it adds show up as
      # an extra "unknown/unknown" platform, which makes the check below --
      # "are both architectures in this tag" -- unable to answer its question.
      # The cache scope is per platform: one shared scope has the two jobs
      # overwrite each other's entries.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      - name: Hand the digest to the next job
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "${{ matrix.platform }} -> $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Assemble the two digests into one multi-arch tag, so `docker pull` picks the
  # right architecture by itself.
  #
  # The moving tag (dev / latest) is rewritten on every push, which is its job.
  # The version tag is written once and then left alone: it exists so a bug
  # report can name the exact build it came from, and a tag that quietly turns
  # into a different image cannot do that. A workflow change therefore costs no
  # version bump.
  # --------------------------------------------------------------------------
  publish:
    name: Publish the multi-arch tag
    needs: [version, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/brother_ql_app
      VERSION: ${{ needs.version.outputs.version }}
      MOVING_TAG: ${{ needs.version.outputs.moving_tag }}
    steps:
      - name: Collect the digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide which tags to write
        id: tags
        run: |
          set -euo pipefail
          tags=""
          [ -n "$MOVING_TAG" ] && tags="$tags -t $IMAGE:$MOVING_TAG"

          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::notice::$IMAGE:$VERSION already exists and is left untouched."
            echo "version_written=false" >> "$GITHUB_OUTPUT"
          else
            tags="$tags -t $IMAGE:$VERSION"
            echo "version_written=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$tags" ]; then
            echo "Nothing to tag on this ref." >&2
            exit 1
          fi
          echo "args=$tags" >> "$GITHUB_OUTPUT"

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create ${{ steps.tags.outputs.args }} \
            $(printf "$IMAGE@sha256:%s " *)

      # A tag that exists but serves the wrong architecture is worse than one
      # that is missing: the first looks like it worked. So the published
      # manifest is read back rather than assumed.
      - name: Check both architectures are in the published tags
        run: |
          set -euo pipefail
          tags="$MOVING_TAG"
          [ "${{ steps.tags.outputs.version_written }}" = "true" ] && tags="$tags $VERSION"

          {
            echo "### Published"
            echo ""
            echo "| Tag | Architectures |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for tag in $tags; do
            archs=$(docker buildx imagetools inspect "$IMAGE:$tag" \
              --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
            echo "$IMAGE:$tag -> $archs"
            echo "| \`$tag\` | $archs |" >> "$GITHUB_STEP_SUMMARY"
            for want in linux/amd64 linux/arm64; do
              case "$archs" in
                *"$want"*) ;;
                *) echo "::error::$want missing from $IMAGE:$tag"; exit 1 ;;
              esac
            done
          done

          if [ "${{ steps.tags.outputs.version_written }}" != "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$VERSION\` already existed and was left as it was." >> "$GITHUB_STEP_SUMMARY"
          fi

  # --------------------------------------------------------------------------
  # The Docker Hub page, which is the first thing most people see of this
  # project and until now said nothing.
  #
  # main only: Docker Hub shows one page for every tag, so a description taken
  # from dev would describe `latest` wrongly.
  #
  # The README cannot go up as it stands. Docker Hub renders markdown but has no
  # repository behind it, so every relative path -- four screenshots, the licence
  # and the changelog -- would be a broken image or a dead link, which is worse
  # than no description at all. It also strips HTML, so the one <img> tag has to
  # become markdown. The rewritten copy is built here and never committed, like
  # the API reference and the analytics snippet in pages.yml.
  # --------------------------------------------------------------------------
  description:
    name: Update the Docker Hub page
    needs: [publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rewrite the README for Docker Hub
        env:
          REPO_URL: https://github.com/${{ github.repository }}
          RAW_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: |
          python3 - <<'PY'
          import os
          import re

          repo = os.environ["REPO_URL"]
          raw = os.environ["RAW_URL"]
          images = (".png", ".jpg", ".jpeg", ".gif", ".svg", ".webp")

          with open("README.md", encoding="utf-8") as handle:
              text = handle.read()

          # Docker Hub strips HTML, and the phone screenshot is the one place
          # this README uses a tag rather than markdown.
          text = re.sub(r'<img\s+src="([^"]+)"\s+alt="([^"]+)"[^>]*>',
                        lambda m: "![%s](%s)" % (m.group(2), m.group(1)), text)

          def absolute(match):
              """Every relative target, whether it is a link or an image.

              Matching on `](...)` rather than the whole `[label](...)` keeps
              nested pairs out of it: a badge wrapped in a link is two of them,
              and a pattern that tries to read the label mis-reads one of the
              two every time.
              """
              target = match.group(1)
              if re.match(r"^(https?:|#|mailto:)", target):
                  return match.group(0)
              path = target.lstrip("./")
              base = raw if path.lower().endswith(images) else repo + "/blob/main"
              return "](%s/%s)" % (base, path)

          text = re.sub(r"\]\(([^)]+)\)", absolute, text)

          # A badge per line renders as a stack wherever a newline inside a
          # paragraph counts as a break, which is most places that are not
          # GitHub. Joined into one line they sit side by side everywhere.
          def join_badges(block):
              lines = block.group(0).strip("\n").split("\n")
              return " ".join(lines) + "\n"

          text = re.sub(r"(?:^\[!\[[^\n]*\n){2,}", join_badges, text, flags=re.M)

          # Docker Hub gives no hint where any of this comes from.
          badge = ("[![Source on GitHub](https://img.shields.io/badge/GitHub-"
                   "source%%20%%26%%20issues-181717?logo=github)](%s)" % repo)
          text = badge + "\n\n" + text

          with open("DOCKERHUB.md", "w", encoding="utf-8") as handle:
              handle.write(text)

          left = re.findall(r"\]\((?!https?:|#|mailto:)([^)]+)\)", text)
          print("Relative targets left:", left or "none")
          if left:
              raise SystemExit("a relative target would break on Docker Hub")
          print("DOCKERHUB.md written, %d characters" % len(text))
          PY

      - name: Push the description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ secrets.DOCKER_USERNAME }}/brother_ql_app
          short-description: "A web interface and REST API for Brother QL label printers"
          readme-filepath: ./DOCKERHUB.md
          enable-url-completion: false

  # --------------------------------------------------------------------------
  # The tag and the GitHub release, last, once there is an image to point at.
  #
  # actions/create-release was used here until now. It has been archived since
  # 2021 and is replaced by the gh CLI, which the runner already has.
  # --------------------------------------------------------------------------
  release:
    name: Tag and release
    needs: [version, publish]
    timeout-minutes: 10
    if: needs.version.outputs.releasable == 'true' && needs.version.outputs.moving_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if the tag is already taken
        id: check
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::notice::Tag $VERSION already exists; nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # The body of this version's own changelog section, keyed off the resolved
      # version so any other heading above it is skipped safely.
      - name: Take the release notes from the changelog
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' changelog.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "No changelog section for $VERSION" >&2
            exit 1
          fi

      - name: Create the tag and the release
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          flags=""
          [ "$PRERELEASE" = "true" ] && flags="--prerelease"
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Release $VERSION" \
            --notes-file /tmp/notes.md \
            $flags
          echo "### Released" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$VERSION\` (pre-release: $PRERELEASE)" >> "$GITHUB_STEP_SUMMARY"
